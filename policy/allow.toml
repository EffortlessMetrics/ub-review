schema_version = "1"
tool = "cargo-allow"

# Default source-tree exception ledger. Keep this consolidated until real
# exception volume proves that narrower ledgers improve reviewability.

[[exception]]
id = "clippy-too-many-arguments-artifact-writers"
kind = "clippy-suppression"
path = "src/main.rs"
lint = "clippy::too_many_arguments"
owner = "ub-review/core"
reason = "Artifact writer functions currently pass explicit packet context while the receipt model settles; refactor after the packet contract is stable."
created = "2026-06-03"
review_after = "2026-10-10"
expires = "2026-12-03"

[[exception]]
id = "task-ledger-shadow"
kind = "rust-lint-suppression"
path = "src/task_ledger.rs"
lint = "dead_code"
owner = "ub-review/core"
reason = "A2.1-A2.3 intentionally land the pure task lifecycle, accounting, and replay contract before A2.4-A2.5 shadow adapters consume every internal item; remove this module-level expectation as those consumers land."
created = "2026-08-27"
review_after = "2026-09-27"
expires = "2026-11-27"

[[exception]]
id = "task-ledger-artifact-shadow"
kind = "rust-lint-suppression"
path = "src/task_ledger_artifact.rs"
lint = "dead_code"
owner = "ub-review/core"
reason = "A2.3 intentionally lands deterministic task-ledger persistence and verification before A2.4 instruments production task sources; remove this module-level expectation when #925 connects the writer."
created = "2026-08-27"
review_after = "2026-09-27"
expires = "2026-11-27"

[[exception]]
id = "non-rust-github-actions"
kind = "non-rust-file"
glob = ".github/workflows/*.yml"
category = "platform-required-workflow"
language = "yaml"
owner = "release/ci"
reason = "GitHub Actions requires workflow YAML; workflow privileges and lane behavior are governed by workflow and CI policy."
created = "2026-06-03"
review_after = "2026-10-10"

[[exception]]
id = "non-rust-docs-and-templates"
kind = "non-rust-file"
glob = "{README.md,docs/**/*.md,templates/**/*.md,REPO_READY.md,RELEASE_NOTES*.md,AGENTS.md,CLAUDE.md,.github/pull_request_template.md,.github/release-notes.md}"
category = "documentation"
language = "markdown"
owner = "ub-review/docs"
reason = "Human and agent operating documentation is intentionally Markdown so GitHub renders it and reviewers can audit it directly."
created = "2026-06-03"
review_after = "2026-09-03"

[[exception]]
id = "non-rust-config-toml"
kind = "non-rust-file"
glob = "{configs,profiles,runtime,policy}/**/*.toml"
category = "configuration-and-policy"
language = "toml"
owner = "ub-review/core"
reason = "Runtime profiles, examples, and policy ledgers are data surfaces that must be easy for humans and agents to diff, validate, and repair."
created = "2026-06-03"
review_after = "2026-09-03"

[[exception]]
id = "non-rust-repo-gate-config"
kind = "non-rust-file"
glob = ".ub-review.toml"
category = "configuration-and-policy"
language = "toml"
owner = "ub-review/core"
reason = "The repo's own gate policy lives at the root .ub-review.toml, the same path consumer repos use, so the dogfood contract is explicit and copyable."
created = "2026-06-06"
review_after = "2026-09-06"

[[exception]]
id = "non-rust-gitattributes"
kind = "non-rust-file"
path = ".gitattributes"
category = "platform-required-config"
language = "gitattributes"
owner = "ub-review/core"
reason = "Git attributes file enforces LF line endings in the index so include_str!()-based contract tests read deterministic bytes on every platform (issue #584)."
created = "2026-06-21"
review_after = "2026-09-21"

[[exception]]
id = "non-rust-ripr-suppressions"
kind = "non-rust-file"
glob = ".ripr/suppressions.toml"
category = "configuration-and-policy"
language = "toml"
owner = "ub-review/core"
reason = "RIPR's durable suppression manifest; every entry carries owner and reason per the suppression-health contract, and suppressed findings stay visible as suppressed in the gate receipt. Content-addressed IDs follow code rather than source lines; the receipt's review_after/expires carries the dating obligation. Re-verify entries after semantic edits and RIPR upgrades. Reviewed 2026-08-08 (PR #848), which added 25 entries for cfg(test) and integration-test fixture probes plus const/static declarations that RIPR 0.10.0 scores as production seams (ripr-swarm#1055). Reviewed 2026-08-21 (PR #870), which added 7 entries for impact_plan::relative_to_repo probes that RIPR 0.10.0 scores weakly_exposed despite exact-value unit-test discrimination of every branch. Reviewed 2026-08-21 (PR #854), which added 287 entries for the base+tests hunk-classification diff: cfg(test) test-module and declaration/const seams scored as production code (ripr-swarm#1055) plus weakly_exposed/no_static_path probes whose behavior is pinned by exact-value assertions in each file's co-located suite but whose discriminate check cannot match output-level assertion text. Reviewed 2026-08-21 (PR #853), which added 29 entries for suggestion-gate/delivery probes whose co-located tests discriminate with exact oracles that RIPR 0.10.0 cannot statically link (fixture_opaque), plus const/array declarations and two cfg(test) fixture lines. Reviewed 2026-08-22 (PR #915), which added 54 entries for the typed comment-plan envelope diff (#913): no_static_path declaration seams (gap variants, envelope/entry fields, schema const, disposition variant) and weakly_exposed parse/join probes whose colocated comment_plan_* and repair-queue tests assert every branch with exact-value oracles that RIPR 0.10.0 cannot statically attribute. Reviewed 2026-08-27 (PR #1255), which added exact receipts for the trusted-base admission declarations, context-free routing, isolated Git plumbing, and cfg(test) fixture probes after focused unit/action/CLI tests pinned successful artifacts and fail-closed identity, object, path, execution, and context boundaries (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #953), which replaced stale A2.1 task-ledger IDs with exact A2.2 accounting/release IDs after fallible truth-table tests pinned timing, terminal, receipt, consumer, revision, replay, and malformed-event behavior (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #954), which added 182 exact A2.3 artifact/replay and control-character validation IDs after co-located Rust and mirrored Python tests pinned cross-language golden bytes plus corruption, ordering, revision, terminal-release, receipt-reference, consumer, snapshot-integrity, and C0/C1 rejection failures (ripr-swarm#1054/#1055)."
created = "2026-06-07"
review_after = "2026-11-21"
expires = "2026-12-22"

[[exception]]
