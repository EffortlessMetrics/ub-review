[[exception]]
id = "bounded-diagnostic-version-probes"
kind = "process-spawn"
glob = "{src/version_probe*.rs,tests/version_probes.rs,tests/fixtures/version_probe.rs}"
owner = "ub-review/diagnostics"
reason = "Issue #1557 diagnostic-only --version adapter: absolute two-second collection/cleanup deadline, independent 4 KiB stream ceilings, no raw diagnostic publication or spool files. Tokio owns cancellable cross-platform pipes; direct-child reaping is reported separately from kill/reap failures. Dedicated controls own and clean fixtures; Linux subreaper proof does not claim product tree containment. General capture/process adoption remains #1279/#1269; version grammar/pins remain #1067."
created = "2026-10-27"
review_after = "2027-01-27"

[[exception]]
id = "coordinated-executable-test-fixtures"
kind = "process-spawn"
path = "tests/common/executable_fixture.rs"
owner = "ub-review/tests"
reason = "PR #1599 adopts #1401's test-only writer/process-creation coordination. The shared launch reader covers Command::spawn only and is released before child wait; executable materialization takes the exclusive writer. Capture keeps null stdin and piped stdout/stderr; inherited-stdio status and explicitly configured spawn retain their caller contracts. Real I/O errors are propagated without retries, sleeps or false expected-failure success. Bounded Linux controls exercise concurrent writer inheritance, retained-writer OS26, exact output, and release before child wait. This receipt covers the helper and its native-output negative control, not production process authority, arbitrary process-tree containment, or unconverted executable writers. Keep raw analyzer limitations and platform gaps explicit; re-review when helper/caller coordination changes."
created = "2026-10-28"
review_after = "2027-01-28"
expires = "2027-04-28"
[[exception]]
id = "native-premerge-admission-wrapper"
kind = "non-rust-file"
glob = "{scripts/{premerge-admission,test-premerge-admission}.py,fixtures/premerge-admission/*.yml}"
category = "platform-wrapper-test"
language = "python/yaml"
owner = "release/ci"
reason = "Issue #1465 bounded native PR admission: standard-library public metadata validation runs without compiling or checking out candidate code. Digest-bound owner request, complete anchored native history, worker/finalizer currentness and explicit dormant fixture / installed production YAML shell controls preserve the two existing proof populations. The unchanged ephemeral job token is used only by immutable protected-source pre-checkout helpers for the fixed current-permission metadata GET; no candidate-fetched helper, new credential, permission expansion, protected settings, check writer or merge service. Bounded owner-explicit terminal retry generations retain native failure history. Python is already supplied by hosted runners; compiling Rust for cheap admission would allocate avoidable product setup. Replace only after equivalent no-checkout custody/negative controls are established."
created = "2026-10-18"
review_after = "2027-01-18"
expires = "2027-04-18"

[[exception]]
id = "native-premerge-admission-test-bridge"
