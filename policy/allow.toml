[[exception]]
id = "non-rust-ripr-suppressions"
kind = "non-rust-file"
glob = ".ripr/suppressions.toml"
category = "configuration-and-policy"
language = "toml"
owner = "ub-review/core"
reason = "RIPR's durable suppression manifest; every entry carries owner and reason per the suppression-health contract, and suppressed findings stay visible as suppressed in the gate receipt. Content-addressed IDs follow code rather than source lines; the receipt's review_after/expires carries the dating obligation. Re-verify entries after semantic edits and RIPR upgrades. Reviewed 2026-08-08 (PR #848), which added 25 entries for cfg(test) and integration-test fixture probes plus const/static declarations that RIPR 0.10.0 scores as production seams (ripr-swarm#1055). Reviewed 2026-08-21 (PR #870), which added 7 entries for impact_plan::relative_to_repo probes that RIPR 0.10.0 scores weakly_exposed despite exact-value unit-test discrimination of every branch. Reviewed 2026-08-21 (PR #854), which added 287 entries for the base+tests hunk-classification diff: cfg(test) test-module and declaration/const seams scored as production code (ripr-swarm#1055) plus weakly_exposed/no_static_path probes whose behavior is pinned by exact-value assertions in each file's co-located suite but whose discriminate check cannot match output-level assertion text. Reviewed 2026-08-21 (PR #853), which added 29 entries for suggestion-gate/delivery probes whose co-located tests discriminate with exact oracles that RIPR 0.10.0 cannot statically link (fixture_opaque), plus const/array declarations and two cfg(test) fixture lines. Reviewed 2026-08-22 (PR #915), which added 54 entries for the typed comment-plan envelope diff (#913): no_static_path declaration seams (gap variants, envelope/entry fields, schema const, disposition variant) and weakly_exposed parse/join probes whose colocated comment_plan_* and repair-queue tests assert every branch with exact-value oracles that RIPR 0.10.0 cannot statically attribute. Reviewed 2026-08-27 (PR #1255), which added exact receipts for the trusted-base admission declarations, context-free routing, isolated Git plumbing, and cfg(test) fixture probes after focused unit/action/CLI tests pinned successful artifacts and fail-closed identity, object, path, execution, and context boundaries (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #953), which replaced stale A2.1 task-ledger IDs with exact A2.2 accounting/release IDs after fallible truth-table tests pinned timing, terminal, receipt, consumer, revision, replay, and malformed-event behavior (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #954), which added 182 exact A2.3 artifact/replay and control-character validation IDs after co-located Rust and mirrored Python tests pinned cross-language golden bytes plus corruption, ordering, revision, terminal-release, receipt-reference, consumer, snapshot-integrity, and C0/C1 rejection failures (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #961), which added 79 exact integration-test loader and fixture-copier receipts after six executable Rust tests pinned the exact corpus, three hosted contradiction shapes, and eleven negative mutation classes; RIPR 0.10.0 cannot attribute fallible anyhow::ensure! oracles inside integration tests (ripr-swarm#1054/#1055). Reviewed 2026-08-27 (issue #955), which carries 273 exact sensor TaskLedger lifecycle receipts after final source review: hosted gate run 33139645715 retained 146 current #955 receipts, removed 40 displaced content-addressed receipts, and added 127 exact subprocess-authority, RIPR detail, aggregate-timeout, and stale-receipt projection IDs. The named focused suites and full Rust, policy, and verifier proof pin lifecycle, timing, terminal, receipt, release, artifact, and reused-output behavior (ripr-swarm#1054/#1055). Reviewed 2026-10-17 (issue #1507 local c21b312 to 4f6aea8): 38 exact RIPR 0.10.0 dispositions after owner-aware raw-row review, four durable native tests and eight compiled production defect controls. Records distinguish declarations/test helpers/deleted statements/unchanged error propagation from observed behavioral seams. The prior hosted three remain inaccessible and unclassified; these dispositions bind only the new local source analysis. Existing review_after/expires and strict-zero threshold are unchanged. Reviewed 2026-10-26 (PR #1552, e2595dd local successor): eleven exact RIPR 0.10.0 declaration/cfg(test) fixture/helper-return dispositions from own hosted run 40291710437. A compiled first-occurrence boundary mutant survived the prior eight tests and was rejected by a new source-membership oracle; the production byte_start probe is now exposed and is not suppressed. A compiled discarded-section-return control is rejected by the existing benign-heading test. Timeout/budget/weight/lease fixture literals receive no production policy proof claim. Threshold, pin, scope and review/expiry dates are unchanged. Reviewed 2026-10-26 (issue #1554): 26 exact RIPR 0.10.0 dispositions after raw-row/source-side review: five signature declarations, four removed calibration/reason-fallback subjects, seven Cargo integration-test evidence subjects, six gate/metrics dispatch subjects and four I/O mapper subjects. Generated CLI corruption/restoration/enforcement controls and six compiled behavioral defect controls discriminate the real arms. A genuine missing/unreadable diagnostic proof gap was closed first; all six defects are rejected. Unknowns remain 106 and are not relabeled exposed. Existing strict-zero threshold, tool pin, scope and review/expiry dates are unchanged; upstream subject/evidence owners remain linked per entry. Follow-up on PR #1559: three exact cmd_summary phase-dispatch subjects after the external plan-only reuse finding. Same-head and different-head generated CLI reuse, twelve bad-phase controls, retained bytes and actual-run recovery pass; both compiled plan/unknown-to-terminal defects are rejected. The new corpus retains 321 raw rows and 114 unknowns; 29 exact dispositions now account for the original 26 plus these three subprocess-attribution limits. No pin, threshold, scope or date changes. Reviewed 2026-10-27 (issue #1556 / PR #1560, tested source 55bc086f0022037f1d6840ab01353d812969f262): retain only probe:src_init.rs:error_path:b7272e6f for the production custom-init recovery payload. New isolated Rust/Cargo 1.95.0 --locked proof and exact diffs/commands/counts/status/assertions are retained in coding task /code/tasks/64387a82-7dfa-416f-87cb-5c079ce3bea7 and prepared for https://github.com/EffortlessMetrics/ub-review/pull/1561; runtime-owned remote delivery blocked the PR-body update. Separately from inaccessible task14923 claims: compiled guard removal fails unit and CLI rejection tests; a token-preserving payload change passes all three unit tests but fails the exact CLI diagnostic; compiled defined-custom fallback fails the unchanged actual-selection CLI assertion. Exact source is restored and all three profile unit tests and both CLI tests pass again. Issue #1556 independently retains the pre-fix CLI reproduction; successful hosted baseline 40443208439 at that source covers exact-output/no-write/custom-selection tests. Parent run 40440239228 artifact 12706256016 retains weakly_exposed/proc_macro_opaque despite indexing the exact assertion; seven raw unknowns remain visible. Source-based attribution reasoning is distinct from executed fault discrimination. Upstream remains ripr-swarm#1528 and public ripr#1453. This is no legacy audit, umbrella renewal, #872 acceptance or integration clearance; Rook must judge evidence and inspect required gates. Existing policy reason prefix, review/expiry dates, pin and strict-zero gate remain unchanged. Reviewed 2026-10-20 (PR #1539 adopted c99069c): 31 exact RIPR0.10.0 exposure dispositions mapped individually to removed/declaration/closing syntax or current timeout/wait/reap/original-outcome behavior. Tests and compiled loss controls are retained in PR1539 comment6304295886 and review5590327902; the adopted tests add exact status fields, cleanup root cause, elapsed interval and typed None. Active upstream oracle/invocation attribution remains ripr#1453 and ripr-swarm#5543. Fourteen raw unknowns remain separate, not newly suppressed; dates, existing receipts, pin and strict-zero threshold are unchanged. Reviewed 2026-10-27 (issue #1557 / selected PR #1571 head 97432a6): 96 exact owned dispositions from current gate 40467647166/artifact 12718145144 after joining all 96 actual unsuppressed subjects to source side, role and oracle. The former main None and two system_detect .ok()? subjects are deleted source; 41 rows belong to test infrastructure; 52 are adapter subjects. Reviewed #1573 head 157bfdaa2324d7f182eaad27abb529b5c79766f4 strengthens three source-visible oracles: independent 4096-byte ceiling, numeric-dotted projection rejection and failed-check/kill-exit cleanup classification. Each disposition rests on its named source role and oracle, independently reviewed at https://github.com/EffortlessMetrics/ub-review/pull/1573#pullrequestreview-5664588966, and actual hosted positive execution at https://github.com/EffortlessMetrics/ub-review/actions/runs/40471680492/job/122080017222 (Rust 1.95.0 --locked Linux; all 8 adapter unit and 7 CLI tests passed). The author reports twelve one-at-a-time compiled defects were rejected and source restored in coding task /code/tasks/4a8e1903-1c29-4298-9e27-d10119b93c62 outputs; its fault patches, commands, counts, exits, assertions and restoration transcript were not independently retrieved. Evidence request https://github.com/EffortlessMetrics/ub-review/pull/1571#issuecomment-6437648510 received explicit transcript-unavailable response https://github.com/EffortlessMetrics/ub-review/pull/1571#issuecomment-6437670454. Those experiments remain author reports and are not the disposition basis; hosted positives do not establish compiled fault rejection. Existing exact label and 159/160/161-byte identity tests, final init-profile tests, previous ledger entries and dates are preserved. Upstream attribution remains ripr#1453 and ripr-swarm#1528; unknowns stay visible. No production grammar/pin change, Windows/macOS proof, product descendant-tree containment, hosted gate clearance or integration authorization is claimed. Existing receipt dates, tool pin, scope and strict-zero threshold remain unchanged. Reviewed 2026-10-28 (PR #1581): one exact local RIPR 0.10.0 deleted-call disposition after a compiled restored-fallback control failed the reporter artifact roundtrip and the restored candidate passed. The local result does not establish the inaccessible hosted gate cause; strict-zero, scope, pin and receipt dates are unchanged. Reviewed 2026-10-28 (PR #1587): twelve exact local RIPR 0.10.0 diff-command syntax dispositions after source mapping and enhanced related/unrelated Git-history regression. Six individually compiled controls removed each of four ignore overrides and each of two fallbacks; all were rejected and restored source passed. This is local evidence only; inaccessible hosted findings remain unclassified. Pin, threshold and dates are unchanged. Reviewed 2026-10-28 (PR #1593, tested source ed538dd4a844eba670fb01c403e21b2a1f4e8d35): three exact retained-conflict reducer match subjects after source-side review and compiled discriminator controls. A fallback-to-confirmation mutant survived the original eight tests; the new multi-party and Dropped-record test closes that oracle gap, and the same mutant plus removed-winner-guard and unavailable-evidence-to-confirmation controls are rejected. Restored source passes nine focused tests. Each exact entry records its subject, oracle, bounded caller contract and upstream ripr#1453 attribution owner. All 18 raw unknowns stay visible; no raw classification is promoted. Existing receipt dates, analyzer pin and strict-zero threshold are unchanged. Reviewed 2026-10-28 (PR #1401 current-main adoption): three exact test-helper dispositions for the shared RwLock initializer and fixture_output Child/Output return boundaries at source tree 2d282b35efd048e5546949fb8db7572910aa6636. Single-run compiled writer-exclusion and spawn-reader removals each reproduce OS26; cleared stdout and forced-success status controls fail exact-byte and doctor-status oracles. Restored controls and the current-main native baseline pass. Relative/absolute root classification differs for the initializer; raw weak classifications and 23 unknowns remain visible. Source-role/observer attribution stays with ripr-swarm#3213/#3161/#6975. Existing receipt dates, pin, scope and strict-zero threshold are unchanged; no hosted clearance is claimed. Reviewed 2026-10-19 (issue #1527, source 0cdfdc4/base ac06293): one exact deleted-base return disposition, probe:src_model_api.rs:return_value:eb71dd15, after independent compiled cleanup/caller/error/success-byte controls. Upstream evidence is EffortlessMetrics/ripr#1453 comment6271519098. Only that local raw row is classified; other candidate holds, strict-zero and existing review_after/expires remain unchanged. Reviewed 2026-10-28 (PR #1576): eight exact local RIPR 0.10.0 scanner dispositions after bracketed_prefix_boundaries pinned valid, nested, escaped, missing-close and length boundaries and eight one-at-a-time compiled mutations were rejected. Attribution remains ripr#1453; local observations do not identify the unavailable hosted findings. Existing receipt dates, tool pin, scope and strict-zero threshold remain unchanged. Reviewed 2026-10-28 (PR #1589): three exact local RIPR 0.10.0 timeout-summary match-arm dispositions, after focused regression and compiled dispatch, command selection, indicator omission and fallback controls; restored source passed. Local preview is not hosted gate evidence; six unknowns remain distinct. See ripr#1453. Existing dates and strict-zero threshold are unchanged. Reviewed 2026-10-28 (PR #1591): 21 exact local RIPR 0.10.0 weak-discriminator dispositions for review patch filename decoding and state reset, supported by exact UTF-8, C escape, invalid header and alias controls. Five isolated compiled fault controls for stale path, hunk reset, octal conversion, tab decoding and normalization guard failed their intended assertions; restored controls passed. Hosted finding identities remain unavailable; strict-zero, tool pin, scope and receipt dates are unchanged."
created = "2026-06-07"
review_after = "2026-11-21"
expires = "2026-12-22"

[[exception]]
id = "non-rust-release-scripts"
kind = "non-rust-file"
glob = "scripts/*"
category = "release-tooling"
language = "python/bash"
owner = "release/ci"
reason = "Existing release and smoke wrappers remain for workflow compatibility; durable automation should move toward Rust or xtask-style checks after parity is proven. For #957, scripts/reconcile-task-projections.py and scripts/test-task-projections.py temporarily extend the existing Python artifact-verifier boundary, reusing its canonical revision and TaskLedger replay rather than introducing another authoritative reducer; #1292 owns their Rust parity migration before deletion. Also for #957, the publication-boundary family comprises scripts/reconcile-publication-boundaries.py (fail-closed entrypoint), scripts/reconcile-publication-boundaries-core.py (bounded reconciliation core), scripts/test-publication-boundaries.py (primary corpus), and scripts/test-publication-transaction-completeness.py (complete prepared-to-terminal accounting regression). These four publication files compare revision-bound prepared, skipped, post-success, post-error, terminal, transaction, and run-stage projections in shadow. They have no posting, scheduling, finalization, or enforcement authority and must be migrated into a durable Rust/verifier boundary or removed before #960 can make FinalizedOutcome production-authoritative. PR #1576 aligns the shadow comment-body bracket scanner with Rust for Markdown links, nested and escaped labels, and UTF-8 byte limits, with publication-reconciliation regressions. All six #957 scripts remain owned by release/ci and must be reviewed, migrated, or explicitly renewed with retained evidence by review_after 2026-10-10; expiry is not an implicit authority or migration decision."
created = "2026-06-03"
review_after = "2026-10-10"
expires = "2026-12-03"

