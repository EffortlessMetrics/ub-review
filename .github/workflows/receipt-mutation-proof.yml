name: receipt/targeted-mutation-proof

# Disposable evidence under #1333/#813; owner release/ci.
# Covered by non-rust-github-actions and non-rust-release-scripts.
# Never merge this observer. No publishing or branch-write permissions.
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: receipt-mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mutate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'fix/1333-versioned-gate-receipts' &&
      github.event.pull_request.head.ref == 'evidence/1347-targeted-mutations'
    name: exact receipt mutations / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Execute exact-source controls and mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 8589934592
          export SUBJECT_ROOT="$RUNNER_TEMP/subject"
          export PACKET_ROOT="$RUNNER_TEMP/mutation-packet"
          git worktree add --detach "$SUBJECT_ROOT" 99a60cf5e3dab78fa84a94af108359c4ff143c33
          python scripts/receipt-mutation-proof.py
      - name: Seal evidence including failures
        if: always()
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'mutation-packet'
          assert root.is_dir()
          paths = sorted(root.iterdir())
          assert len(paths) < 32 and all(p.is_file() and not p.is_symlink() for p in paths)
          rows = [dict(path=p.name, bytes=p.stat().st_size, sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in paths]
          data = (json.dumps(dict(authority='evidence-only', files=rows),indent=2)+'\n').encode()
          assert sum(r['bytes'] for r in rows)+len(data) <= 33554432
          (root/'manifest.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('sealed=true\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.seal.outputs.sealed == 'true'
        with:
          name: receipt-mutation-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-packet/
          if-no-files-found: error
          retention-days: 30
