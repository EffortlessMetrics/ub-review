name: quality/bootstrap-contract

# Owner release/ci, #1345. Offline tests only; no GitHub collection on PRs.
on:
  pull_request:
    paths:
      - '.github/workflows/quality-backfill.yml'
      - '.github/workflows/quality-bootstrap-tests.yml'
      - 'scripts/quality-bootstrap.py'
      - 'scripts/test-quality-bootstrap.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 scripts/test-quality-bootstrap.py -v
