name: quality/bootstrap-contract

# Owner release/ci, #1345/#1465. Session checks are local; the actual proposed
# integration receives this offline contract. No development event allocates it.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          python3 scripts/test-quality-bootstrap.py -v
          python3 scripts/test-integration-workflows.py -v
