name: Temporary #956 marker cleanup

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger
    paths:
      - .github/workflows/_temporary-956-marker-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact marker tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Remove marker and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/956-proof-worker-task-ledger'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git rm -f .github/ub-review-956-policy-finalized.txt
          git rm -f .github/workflows/_temporary-956-marker-cleanup.yml
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'ci: remove #956 policy finalizer marker'
          git push origin "HEAD:${branch}"
