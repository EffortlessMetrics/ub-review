name: ripr/candidate-shadow

# Evidence-only lane for #813. The released RIPR binary remains the required
# authority; the exact-source candidate only measures compatibility on one
# frozen input. This workflow has no PR/check write, OIDC, or secret authority.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ripr-candidate-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: frozen stable/candidate comparison
    if: >-
      github.event.pull_request.base.ref == 'fix/1305-terminal-work-queue' &&
      github.event.pull_request.head.ref == 'evidence/1306-ripr-011-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBJECT_BASE: 62024014c57a81162da761babea2fd0d677f5f42
      SUBJECT_HEAD: c6dbdf9c1798c1e94e4a136a008db6b077aff161
      RIPR_STABLE_VERSION: 0.10.0
      RIPR_CANDIDATE_SHA: bf39b6184c11fb1fabf6d1843cfec17e76a3349f
      # The first run proved the candidate default 1,000-line partition was
      # incomplete for this 1,912-line subject. Raise both documented bounds
      # explicitly while retaining hard process/output limits below.
      RIPR_PARTIAL_DIFF_FILE_BUDGET: 500
      RIPR_PARTIAL_DIFF_LINE_BUDGET: 5000
      MAX_RAW_BYTES: 536870912
      MAX_BADGE_BYTES: 16777216
      MAX_STDERR_BYTES: 16777216
      MAX_PUBLISH_BYTES: 201326592

    steps:
      - name: Check out evidence harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze exact subject input
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/fix/1305-terminal-work-queue:refs/remotes/origin/fix/1305-terminal-work-queue"
          observed="$(git rev-parse refs/remotes/origin/fix/1305-terminal-work-queue)"
          if [[ "$observed" != "$SUBJECT_HEAD" ]]; then
            echo "::error::subject branch advanced: expected $SUBJECT_HEAD, observed $observed"
            exit 1
          fi
          git cat-file -e "$SUBJECT_BASE^{commit}"
          git cat-file -e "$SUBJECT_HEAD^{commit}"
          git merge-base --is-ancestor "$SUBJECT_BASE" "$SUBJECT_HEAD"

          subject="$RUNNER_TEMP/ub-review-subject"
          raw="$RUNNER_TEMP/ripr-shadow-raw"
          out="$GITHUB_WORKSPACE/target/ripr-shadow"
          diff="$RUNNER_TEMP/subject.diff"
          rm -rf "$subject" "$raw" "$out"
          mkdir -p "$raw" "$out"
          git worktree add --detach "$subject" "$SUBJECT_HEAD"
          git diff --binary --full-index --no-ext-diff \
            "$SUBJECT_BASE" "$SUBJECT_HEAD" > "$diff"
          test -s "$diff"

          tree="$(git rev-parse "$SUBJECT_HEAD^{tree}")"
          diff_sha="$(sha256sum "$diff" | cut -d' ' -f1)"
          printf 'SUBJECT_ROOT=%s\n' "$subject" >> "$GITHUB_ENV"
          printf 'RAW_ROOT=%s\n' "$raw" >> "$GITHUB_ENV"
          printf 'PUBLISH_ROOT=%s\n' "$out" >> "$GITHUB_ENV"
          printf 'SUBJECT_DIFF=%s\n' "$diff" >> "$GITHUB_ENV"
          printf 'SUBJECT_TREE=%s\n' "$tree" >> "$GITHUB_ENV"
          printf 'DIFF_SHA256=%s\n' "$diff_sha" >> "$GITHUB_ENV"

          python scripts/compare-ripr-shadow.py --self-test
          python -m py_compile scripts/compare-ripr-shadow.py
          cat > "$out/frozen-input.json" <<JSON
          {
            "repository": "EffortlessMetrics/ub-review",
            "base_commit": "$SUBJECT_BASE",
            "head_commit": "$SUBJECT_HEAD",
            "head_tree": "$tree",
            "diff_sha256": "$diff_sha",
            "stable_source": "crates.io:ripr@$RIPR_STABLE_VERSION",
            "candidate_source": "https://github.com/EffortlessMetrics/ripr.git@$RIPR_CANDIDATE_SHA",
            "candidate_file_budget": $RIPR_PARTIAL_DIFF_FILE_BUDGET,
            "candidate_line_budget": $RIPR_PARTIAL_DIFF_LINE_BUDGET,
            "authority": "shadow-only"
          }
          JSON

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version --verbose > "$PUBLISH_ROOT/rustc.version.txt"
          cargo --version --verbose > "$PUBLISH_ROOT/cargo.version.txt"

      - name: Install released stable RIPR
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/ripr-stable-target" \
            cargo install --locked \
              --root "$RUNNER_TEMP/ripr-stable" \
              --version "$RIPR_STABLE_VERSION" \
              ripr
          "$RUNNER_TEMP/ripr-stable/bin/ripr" --version \
            > "$PUBLISH_ROOT/stable.version.txt"

      - name: Install exact-source RIPR candidate
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/ripr-candidate-target" \
            cargo install --locked \
              --root "$RUNNER_TEMP/ripr-candidate" \
              --git https://github.com/EffortlessMetrics/ripr.git \
              --rev "$RIPR_CANDIDATE_SHA" \
              ripr
          "$RUNNER_TEMP/ripr-candidate/bin/ripr" --version \
            > "$PUBLISH_ROOT/candidate.version.txt"

      - name: Run both analyzers on identical frozen input
        shell: bash
        run: |
          set -euo pipefail
          run_ripr() {
            local name="$1"
            local binary="$2"
            local format="$3"
            local label="$4"
            local maximum="$5"
            local output="$RAW_ROOT/$name.$label.json"
            local stderr="$RAW_ROOT/$name.$label.stderr"
            set +e
            timeout --signal=TERM --kill-after=30s 900 \
              "$binary" check \
                --root "$SUBJECT_ROOT" \
                --diff "$SUBJECT_DIFF" \
                --mode ready \
                --format "$format" \
              > "$output" \
              2> "$stderr"
            local code="$?"
            set -e
            printf '%s\n' "$code" > "$PUBLISH_ROOT/$name.$label.exit.txt"
            if [[ ! -s "$output" ]]; then
              echo "::error::$name/$format produced no JSON output (exit $code)"
              exit 1
            fi
            local bytes
            bytes="$(stat -c %s "$output")"
            if (( bytes > maximum )); then
              echo "::error::$name/$format output is $bytes bytes; maximum is $maximum"
              exit 1
            fi
            local stderr_bytes
            stderr_bytes="$(stat -c %s "$stderr")"
            if (( stderr_bytes > MAX_STDERR_BYTES )); then
              echo "::error::$name/$format stderr is $stderr_bytes bytes; maximum is $MAX_STDERR_BYTES"
              exit 1
            fi
          }

          run_ripr stable "$RUNNER_TEMP/ripr-stable/bin/ripr" json json "$MAX_RAW_BYTES"
          run_ripr candidate "$RUNNER_TEMP/ripr-candidate/bin/ripr" json json "$MAX_RAW_BYTES"
          run_ripr stable "$RUNNER_TEMP/ripr-stable/bin/ripr" badge-json badge "$MAX_BADGE_BYTES"
          run_ripr candidate "$RUNNER_TEMP/ripr-candidate/bin/ripr" badge-json badge "$MAX_BADGE_BYTES"

      - name: Inspect candidate completeness
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python - "$RAW_ROOT/candidate.json.json" "$RAW_ROOT/candidate.badge.json" \
            "$PUBLISH_ROOT/candidate-scope.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw_path, badge_path, receipt_path, output_path = map(Path, sys.argv[1:])
          raw = json.loads(raw_path.read_text())
          badge = json.loads(badge_path.read_text())
          outcome = raw.get("analysis_outcome")
          scope = raw.get("analysis_scope")
          nested = outcome.get("outcome") if isinstance(outcome, dict) else None
          limitations = nested.get("limitations", []) if isinstance(nested, dict) else []
          kind = nested.get("kind") if isinstance(nested, dict) else None
          complete_kinds = {
              "no_scope",
              "no_changed_lines",
              "no_behavioral_candidates",
              "complete_no_findings",
              "complete_with_findings",
          }
          scope_limited = False
          scope_valid = scope is None or isinstance(scope, dict)
          if isinstance(scope, dict):
              run_status = scope.get("run_status")
              eligibility = scope.get("gate_eligibility")
              scope_limited = (
                  (isinstance(run_status, str) and ("partial" in run_status or "limited" in run_status))
                  or eligibility == "ineligible"
              )
          preview_skipped = badge.get("preview_skipped")
          preview_complete = isinstance(preview_skipped, list) and preview_skipped == []
          complete = (
              isinstance(outcome, dict)
              and isinstance(nested, dict)
              and outcome.get("analysis_complete") is True
              and kind in complete_kinds
              and limitations == []
              and scope_valid
              and not scope_limited
              and preview_complete
          )
          receipt = {
              "schema": "ub-review.ripr_candidate_scope.v1",
              "authority": "shadow-only",
              "completeness_authority": "analysis_outcome",
              "complete_for_comparison": complete,
              "analysis_outcome": outcome,
              "analysis_outcome_kind": kind,
              "analysis_scope": scope,
              "analysis_scope_limited": scope_limited,
              "badge_status": badge.get("status"),
              "badge_counts": badge.get("counts"),
              "badge_preview_skipped": preview_skipped,
              "limitations": limitations,
          }
          receipt_path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          with output_path.open("a") as stream:
              stream.write(f"complete={'true' if complete else 'false'}\n")
          PY

      - name: Build bounded compatibility receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.scope.outputs.complete }}" == "true" ]]; then
            python scripts/compare-ripr-shadow.py \
              --stable-json "$RAW_ROOT/stable.json.json" \
              --candidate-json "$RAW_ROOT/candidate.json.json" \
              --stable-version-file "$PUBLISH_ROOT/stable.version.txt" \
              --candidate-version-file "$PUBLISH_ROOT/candidate.version.txt" \
              --stable-exit-file "$PUBLISH_ROOT/stable.json.exit.txt" \
              --candidate-exit-file "$PUBLISH_ROOT/candidate.json.exit.txt" \
              --subject-base "$SUBJECT_BASE" \
              --subject-head "$SUBJECT_HEAD" \
              --subject-tree "$SUBJECT_TREE" \
              --diff-sha256 "$DIFF_SHA256" \
              --stable-source "crates.io:ripr@$RIPR_STABLE_VERSION" \
              --candidate-source "git:ripr@$RIPR_CANDIDATE_SHA" \
              --output-dir "$PUBLISH_ROOT"
          else
            cat > "$PUBLISH_ROOT/comparison.md" <<'MARKDOWN'
          # RIPR candidate shadow comparison

          Candidate typed analysis outcome, optional scope metadata, or preview-skip signal did not establish complete diff analysis. No finding-count, gap-count, or promotion comparison is authorized. Inspect `candidate-scope.json` and the retained raw/badge outputs.
          MARKDOWN
          fi

          cp "$RAW_ROOT/stable.badge.json" "$PUBLISH_ROOT/stable.badge.json"
          cp "$RAW_ROOT/candidate.badge.json" "$PUBLISH_ROOT/candidate.badge.json"
          gzip -6 -c "$RAW_ROOT/stable.json.json" \
            > "$PUBLISH_ROOT/stable.raw.json.gz"
          gzip -6 -c "$RAW_ROOT/candidate.json.json" \
            > "$PUBLISH_ROOT/candidate.raw.json.gz"
          for name in stable candidate; do
            for label in json badge; do
              gzip -6 -c "$RAW_ROOT/$name.$label.stderr" \
                > "$PUBLISH_ROOT/$name.$label.stderr.gz"
            done
          done
          gzip -6 -c "$SUBJECT_DIFF" > "$PUBLISH_ROOT/subject.diff.gz"

          if find "$PUBLISH_ROOT" -type l -print -quit | grep -q .; then
            echo "::error::publish tree contains a symlink"
            exit 1
          fi
          files="$(find "$PUBLISH_ROOT" -type f | wc -l)"
          bytes="$(du -sb "$PUBLISH_ROOT" | cut -f1)"
          if (( files > 32 )); then
            echo "::error::publish tree contains $files files; maximum is 32"
            exit 1
          fi
          if (( bytes > MAX_PUBLISH_BYTES )); then
            echo "::error::publish tree is $bytes bytes; maximum is $MAX_PUBLISH_BYTES"
            exit 1
          fi

          (
            cd "$PUBLISH_ROOT"
            find . -type f ! -name manifest.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > manifest.sha256
          )
          cat "$PUBLISH_ROOT/comparison.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded shadow receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-candidate-shadow-pr1306
          path: target/ripr-shadow
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Require complete candidate analysis for comparison
        if: always() && steps.scope.outputs.complete != 'true'
        shell: bash
        run: |
          echo "::error::candidate typed analysis outcome did not establish complete comparable input; no comparison is authorized"
          exit 1
