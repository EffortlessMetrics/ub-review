name: Finish tokmd 1.15 doctor assertions

on:
  push:
    branches:
      - chore/tokmd-1.15

permissions:
  contents: write

jobs:
  rewrite-doctor-assertions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v5
        with:
          ref: chore/tokmd-1.15
          fetch-depth: 0

      - name: Align doctor assertions and prove residual scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")
          count = text.count("1.12.0")
          if count != 2:
              raise SystemExit(f"{path}: expected exactly 2 stale doctor assertions, found {count}")
          path.write_text(text.replace("1.12.0", "1.15.0"), encoding="utf-8")
          print(f"{path}: replaced {count} occurrence(s)")
          PY

          live_residuals="$(git grep -n '1\.12\.0' -- ':!docs/issue-ledger.md' || true)"
          if [[ -n "$live_residuals" ]]; then
            printf '%s\n' "$live_residuals" >&2
            echo "tokmd 1.12.0 remains outside the historical issue ledger" >&2
            exit 1
          fi

          historical_count="$(git grep -o '1\.12\.0' -- docs/issue-ledger.md | wc -l | tr -d ' ')"
          if [[ "$historical_count" != "1" ]]; then
            echo "expected exactly one historical 1.12.0 ledger receipt; found $historical_count" >&2
            exit 1
          fi

          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add src/main.rs
          git rm .github/workflows/tokmd-pin-followup.yml
          git commit -m "test: align tokmd doctor expectations with 1.15.0"
          git push origin HEAD:chore/tokmd-1.15
