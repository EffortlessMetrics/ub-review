name: Release Portability Proof

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/release-binary.yml
      - .github/workflows/release-portability-proof.yml
      - scripts/prove-release-portability.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-portability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  immutable-release-runtime:
    name: v0.1.0 runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prove exact release portability
        run: bash scripts/prove-release-portability.sh

      - name: Upload release portability receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-v0.1.0-release-portability
          path: target/release-portability
          if-no-files-found: error
          retention-days: 30

  strict-release-no-fallback:
    name: strict release rejects missing asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:24.04
    permissions:
      contents: read
    steps:
      - name: Prepare clean container
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git >/tmp/apt.log
          if command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo unexpectedly present: $(command -v cargo)"
            exit 1
          fi
          if command -v rustc >/dev/null 2>&1; then
            echo "::error::rustc unexpectedly present: $(command -v rustc)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reject missing release asset without source fallback
        id: missing_release
        continue-on-error: true
        uses: ./
        with:
          setup-rust: 'false'
          install-tools: 'false'
          install-mode: release
          release-version: v0.1.0
          release-asset: ub-review-missing-x86_64-unknown-linux-gnu.tar.gz
          posting: artifact-only
          model-mode: off

      - name: Verify fail-closed resolver receipt
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.missing_release.outcome }}
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" != "failure" ]]; then
            echo "::error::missing strict-release asset did not fail: $STEP_OUTCOME"
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/ub-review-action-src" ]]; then
            echo "::error::strict release attempted to materialize a source fallback"
            find "$RUNNER_TEMP/ub-review-action-src" -maxdepth 2 -print || true
            exit 1
          fi
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::Rust tooling appeared during strict release resolution"
            exit 1
          fi

          mkdir -p target/release-portability
          cat > target/release-portability/resolver-no-fallback.json <<JSON
          {
            "schema": "ub-review.release_resolver_no_fallback.v1",
            "action_head_sha": "${GITHUB_SHA}",
            "release_tag": "v0.1.0",
            "requested_asset": "ub-review-missing-x86_64-unknown-linux-gnu.tar.gz",
            "step_outcome": "${STEP_OUTCOME}",
            "cargo_present": false,
            "rustc_present": false,
            "source_workdir_present": false,
            "source_build_used": false,
            "outcome": "rejected_without_fallback"
          }
          JSON

      - name: Upload strict-release receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-v0.1.0-resolver-no-fallback
          path: target/release-portability/resolver-no-fallback.json
          if-no-files-found: error
          retention-days: 30
