name: Temporary exact source export for #1266

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

permissions: {}

jobs:
  export:
    name: export exact tracked source tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact tracked tree
        run: git archive --format=tar.gz --output=/tmp/ub-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: ub-review-source-tree
          path: /tmp/ub-review-source.tar.gz
          if-no-files-found: error
          retention-days: 1
