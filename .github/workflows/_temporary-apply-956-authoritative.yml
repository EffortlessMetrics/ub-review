name: Temporary authoritative #956 apply

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

permissions:
  contents: write

concurrency:
  group: ub-review-956-authoritative-apply
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Reconstruct exact source repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VALIDATION_DIR="$RUNNER_TEMP/ub-review-956-validation"
          printf 'VALIDATION_DIR=%s\n' "$VALIDATION_DIR" >> "$GITHUB_ENV"
          chunks=(.github/ub-review-956-authoritative.patch.*)
          if [[ ${#chunks[@]} -ne 7 || ! -f .github/ub-review-956-authoritative.patch.06 ]]; then
            printf 'Authoritative source transfer incomplete: %s/7 chunks present.\n' "${#chunks[@]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$VALIDATION_DIR"
          cat "${chunks[@]}" > /tmp/ub-review-956-authoritative.patch
          printf '%s  %s\n' 'bb6b6dbcf34910c3ff60cfe6ef1bb03a0921ab4859ed5ad6c8fe33d38d0c438b' /tmp/ub-review-956-authoritative.patch | sha256sum --check --strict
          printf '%s  %s\n' 'b3ed673a34690957d42a7d30dffe10a328462217dc18f0ef7a2e12b10cdd43fc' .github/ub-review-956-compile-fix.patch | sha256sum --check --strict
          git apply --check --verbose /tmp/ub-review-956-authoritative.patch
          git apply /tmp/ub-review-956-authoritative.patch
          git apply --check --verbose .github/ub-review-956-compile-fix.patch
          git apply .github/ub-review-956-compile-fix.patch
          cargo fmt --all
          git diff --check
          git diff --binary > "$VALIDATION_DIR/formatted-source.patch"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Validate proof and worker TaskLedger slice
        if: steps.repair.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check --locked --all-targets --all-features
            cargo test --locked --all-targets proof_task_ledger
            cargo test --locked --all-targets worker_proof_tests
            cargo test --locked --all-targets proof::command
            cargo test --locked --all-targets proof::red_green
            cargo test --locked --all-targets proof::build
            cargo test --locked --all-targets proof::broker
            cargo test --locked --all-targets sensor_task_ledger
            cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            cargo xtask policy-check
            python scripts/verify-bun-review-artifacts.py --self-test
            cargo test --locked --workspace --all-targets
          } 2>&1 | tee "$VALIDATION_DIR/validation.log"

      - name: Replace transport with validated source
        if: steps.repair.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/ub-review-956-authoritative.patch.*
          git rm -f .github/ub-review-956-repair.patch.*
          git rm -f .github/ub-review-authority-repair.patch.*
          git rm -f .github/ub-review-956-compile-fix.patch
          git rm -f .github/validation-trigger-*.txt
          git rm -f .github/workflows/_temporary-authority-apply.yml
          git rm -f .github/workflows/_temporary-finalize-956.yml
          git rm -f .github/workflows/_temporary-source-export.yml
          git rm -f .github/workflows/_temporary-apply-956-authoritative.yml
          git add -A
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(task-ledger): observe proof and worker execution'
          git push origin HEAD:codex/956-proof-worker-task-ledger

      - name: Upload validation receipts
        if: always() && steps.repair.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proof-task-ledger-validation-${{ github.sha }}
          path: ${{ runner.temp }}/ub-review-956-validation
          if-no-files-found: warn
          retention-days: 1
