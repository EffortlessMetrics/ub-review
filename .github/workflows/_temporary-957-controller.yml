name: Temporary #957 source controller

on:
  push:
    branches:
      - codex/957-cross-projection-reconciliation

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ub-review-957-source-controller
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect substantive source change
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if git diff --quiet origin/main...HEAD -- \
            ':(exclude).github/workflows/_temporary-957-controller.yml'; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.source.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Validate exact #957 source
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo xtask policy-check
          python scripts/verify-bun-review-artifacts.py --self-test

      - name: Publish clean validated branch
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/957-cross-projection-reconciliation'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git rm -f .github/workflows/_temporary-957-controller.yml
          git add -A
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'ci: publish validated #957 source'
          git push origin "HEAD:${branch}"

      - name: Open or update the single draft PR
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='codex/957-cross-projection-reconciliation'
          body_file="$RUNNER_TEMP/pr-body.md"
          cat > "$body_file" <<'EOF'
          ## Objective

          Reconcile the durable TaskLedger event stream and replayed snapshot against the leases and command/proof receipts production already emits. Contradictory projections fail explicitly; scheduling, proof selection, gate classification, artifact filenames, and public review output remain unchanged.

          ## Verification boundary

          The branch source passed rustfmt, locked all-target/all-feature check, the full locked workspace suite, strict Clippy, policy-check, and the artifact-verifier self-test before this clean PR head was published.

          ## Review boundary

          Review the durable source and tests, not removed controller history. Verify immutable revision and task identity joins, command side/phase/order, terminal disposition, cleanup, receipt target existence, release ordering, stale-output rejection, and event/snapshot agreement across sensor, proof, worker, optional, model-off, and model-on paths.

          Closes #957
          EOF
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$branch" \
              --title 'runtime: reconcile TaskLedger projections' --body-file "$body_file"
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title 'runtime: reconcile TaskLedger projections' --body-file "$body_file"
          fi
