name: Quality Backfill

# Artifact-only telemetry lane: aggregates recent gate receipts and GitHub
# reviewer-state receipts. It never posts reviews or mutates repository state.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: quality-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Quality telemetry backfill
    runs-on: ubuntu-latest
    # Source packets are inspected only when their compressed artifact is
    # bounded. Downloaded inputs live outside the publication tree.
    timeout-minutes: 45
    env:
      UB_REVIEW_QUALITY_WINDOW_DAYS: 30
      UB_REVIEW_QUALITY_INPUT_DIR: target/ub-review-quality/source
      UB_REVIEW_QUALITY_PUBLISH_DIR: target/ub-review-quality-publish
      UB_REVIEW_QUALITY_SOURCE_ARTIFACT_MAX_BYTES: 67108864
      UB_REVIEW_QUALITY_MAX_FILES: 512
      UB_REVIEW_QUALITY_MAX_FILE_BYTES: 16777216
      UB_REVIEW_QUALITY_MAX_TOTAL_BYTES: 67108864
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Build ub-review
        run: cargo build --locked --bin ub-review

      - name: Collect GitHub receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf -- "$UB_REVIEW_QUALITY_INPUT_DIR"
          mkdir -p "$UB_REVIEW_QUALITY_INPUT_DIR/github"
          gh run list \
            --workflow ub-review-gate.yml \
            --event pull_request \
            --limit 100 \
            --json databaseId,headSha,conclusion,createdAt,displayTitle,url \
            > "$UB_REVIEW_QUALITY_INPUT_DIR/github/actions-runs.json"
          gh pr list \
            --state all \
            --limit 100 \
            --json number,title,state,isDraft,mergedAt,reviewDecision,headRefOid,comments,reviews,url \
            > "$UB_REVIEW_QUALITY_INPUT_DIR/github/pr-state.json"
          python - <<'PY' > "$UB_REVIEW_QUALITY_INPUT_DIR/github/pr-numbers.txt"
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["UB_REVIEW_QUALITY_INPUT_DIR"]) / "github"
          for pull in json.loads((source / "pr-state.json").read_text()):
              number = pull.get("number")
              if isinstance(number, int):
                  print(number)
          PY
          target/debug/ub-review quality-github-collect \
            --repo "$GH_REPO" \
            --source-dir "$UB_REVIEW_QUALITY_INPUT_DIR/github" \
            --pull-numbers-file target/ub-review-quality/source/github/pr-numbers.txt
          target/debug/ub-review quality-github-outcomes \
            --source-dir "$UB_REVIEW_QUALITY_INPUT_DIR/github" \
            --out "$UB_REVIEW_QUALITY_INPUT_DIR/github/github-quality-outcomes.json"

      - name: Download bounded recent gate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$UB_REVIEW_QUALITY_INPUT_DIR/runs"
          python - <<'PY' > "$UB_REVIEW_QUALITY_INPUT_DIR/run-ids.txt"
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source = Path(os.environ["UB_REVIEW_QUALITY_INPUT_DIR"])
          runs = json.loads((source / "github/actions-runs.json").read_text())
          window_days = int(os.environ["UB_REVIEW_QUALITY_WINDOW_DAYS"])
          cutoff = datetime.now(timezone.utc) - timedelta(days=window_days)
          for run in runs:
              created_at = run.get("createdAt")
              if not created_at:
                  continue
              created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if (
                  created >= cutoff
                  and run.get("conclusion") in {"success", "failure"}
                  and run.get("databaseId")
              ):
                  print(run["databaseId"])
          PY
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifact_size="$(
              gh api "repos/${GITHUB_REPOSITORY:?}/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[] | select(.name == "ub-review-gate" and .expired == false) | .size_in_bytes' \
                2>/dev/null | head -n 1 || true
            )"
            if [[ ! "$artifact_size" =~ ^[0-9]+$ ]]; then
              echo "::notice::gate artifact unavailable for run $run_id; skipping quality source"
              continue
            fi
            if (( artifact_size > UB_REVIEW_QUALITY_SOURCE_ARTIFACT_MAX_BYTES )); then
              echo "::notice::gate artifact for run $run_id is $artifact_size bytes; skipping source above $UB_REVIEW_QUALITY_SOURCE_ARTIFACT_MAX_BYTES bytes"
              continue
            fi
            mkdir -p "$UB_REVIEW_QUALITY_INPUT_DIR/runs/$run_id"
            gh run download "$run_id" \
              --name ub-review-gate \
              --dir "$UB_REVIEW_QUALITY_INPUT_DIR/runs/$run_id" || true
          done < "$UB_REVIEW_QUALITY_INPUT_DIR/run-ids.txt"

      - name: Download bounded previous quality backfill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$UB_REVIEW_QUALITY_INPUT_DIR/previous"
          gh run list \
            --workflow quality-backfill.yml \
            --status success \
            --limit 5 \
            --json databaseId \
            > "$UB_REVIEW_QUALITY_INPUT_DIR/previous/previous-quality-runs.json"
          previous_run="$(
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          current = os.environ.get("GITHUB_RUN_ID")
          source = Path(os.environ["UB_REVIEW_QUALITY_INPUT_DIR"])
          runs = json.loads((source / "previous/previous-quality-runs.json").read_text())
          for run in runs:
              run_id = str(run.get("databaseId") or "")
              if run_id and run_id != current:
                  print(run_id)
                  break
          PY
          )"
          if [[ -n "$previous_run" ]]; then
            artifact_size="$(
              gh api "repos/${GITHUB_REPOSITORY:?}/actions/runs/$previous_run/artifacts" \
                --jq '.artifacts[] | select(.name == "ub-review-quality-backfill" and .expired == false) | .size_in_bytes' \
                2>/dev/null | head -n 1 || true
            )"
            if [[ ! "$artifact_size" =~ ^[0-9]+$ ]]; then
              echo "::notice::previous quality artifact unavailable on run $previous_run; continuing without trend input"
            elif (( artifact_size > UB_REVIEW_QUALITY_SOURCE_ARTIFACT_MAX_BYTES )); then
              echo "::notice::previous quality artifact is $artifact_size bytes; skipping recursive source above $UB_REVIEW_QUALITY_SOURCE_ARTIFACT_MAX_BYTES bytes"
            else
              gh run download "$previous_run" \
                --name ub-review-quality-backfill \
                --dir "$UB_REVIEW_QUALITY_INPUT_DIR/previous" || true
            fi
          fi

      - name: Build compact quality backfill
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$UB_REVIEW_QUALITY_PUBLISH_DIR"
          mkdir -p "$UB_REVIEW_QUALITY_PUBLISH_DIR"
          args=()
          while IFS= read -r receipt; do
            run_dir="${receipt%/review/quality-receipt.json}"
            args+=(--run-dir "$run_dir")
          done < <(find "$UB_REVIEW_QUALITY_INPUT_DIR/runs" -path '*/review/quality-receipt.json' -type f | sort)
          previous=()
          previous_file="$(find "$UB_REVIEW_QUALITY_INPUT_DIR/previous" -path '*/review/quality-backfill.json' -type f | sort | head -n 1 || true)"
          if [[ -n "$previous_file" ]]; then
            previous=(--previous "$previous_file")
          fi
          target/debug/ub-review quality-backfill \
            --out "$UB_REVIEW_QUALITY_PUBLISH_DIR" \
            --github-outcomes "$UB_REVIEW_QUALITY_INPUT_DIR/github/github-quality-outcomes.json" \
            --window-days "$UB_REVIEW_QUALITY_WINDOW_DAYS" \
            "${previous[@]}" \
            "${args[@]}"

      - name: Verify quality backfill publication tree
        id: publish_preflight
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            echo "quality backfill build ended $BUILD_OUTCOME; refusing artifact upload" >&2
            exit 1
          fi
          test -s "$UB_REVIEW_QUALITY_PUBLISH_DIR/review/quality-backfill.json"
          if find "$UB_REVIEW_QUALITY_PUBLISH_DIR" -type l -print -quit | grep -q .; then
            echo "quality backfill publish tree contains a symlink" >&2
            exit 1
          fi
          if find "$UB_REVIEW_QUALITY_PUBLISH_DIR" -type d \( -name source -o -name input -o -name runs -o -name previous \) -print -quit | grep -q .; then
            echo "quality backfill publish tree contains a source/input directory" >&2
            exit 1
          fi
          mapfile -d '' files < <(find "$UB_REVIEW_QUALITY_PUBLISH_DIR" -type f -print0 | sort -z)
          file_count="${#files[@]}"
          if (( file_count == 0 || file_count > UB_REVIEW_QUALITY_MAX_FILES )); then
            echo "quality backfill publish file count $file_count is outside 1..$UB_REVIEW_QUALITY_MAX_FILES" >&2
            exit 1
          fi
          total_bytes=0
          for file in "${files[@]}"; do
            file_bytes="$(stat -c '%s' -- "$file")"
            if (( file_bytes > UB_REVIEW_QUALITY_MAX_FILE_BYTES )); then
              echo "quality backfill file $file is $file_bytes bytes; limit is $UB_REVIEW_QUALITY_MAX_FILE_BYTES" >&2
              exit 1
            fi
            total_bytes=$((total_bytes + file_bytes))
          done
          if (( total_bytes > UB_REVIEW_QUALITY_MAX_TOTAL_BYTES )); then
            echo "quality backfill publish tree is $total_bytes bytes; limit is $UB_REVIEW_QUALITY_MAX_TOTAL_BYTES" >&2
            exit 1
          fi
          printf 'Quality backfill publish tree: %s files, %s expanded bytes\n' "$file_count" "$total_bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.publish_preflight.outcome == 'success'
        with:
          name: ub-review-quality-backfill
          path: ${{ env.UB_REVIEW_QUALITY_PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 30