name: temporary-947-fix

on:
  push:
    branches: [ci/947-independent-baseline]
    paths: [.github/workflows/branch-947-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/947-independent-baseline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair exact actionlint and rustfmt failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/independent-baseline.yml')
          text = path.read_text()
          old = '''    env:
                CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
                CARGO_TARGET_DIR: ${{ runner.temp }}/ub-review-independent-target
                RECEIPT_DIR: ${{ runner.temp }}/ub-review-independent-baseline
              steps:
                - name: Checkout exact candidate revision without credentials
          '''.replace('              ', '')
          new = '''    env:
                CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
              steps:
                - name: Checkout exact candidate revision without credentials
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit(f'workflow env target count={text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''          persist-credentials: false

              - name: Verify exact candidate identity
          '''.replace('              ', '')
          replacement = '''          persist-credentials: false

              - name: Set isolated runtime paths
                shell: bash
                run: |
                  set -euo pipefail
                  echo "CARGO_TARGET_DIR=$RUNNER_TEMP/ub-review-independent-target" >> "$GITHUB_ENV"
                  echo "RECEIPT_DIR=$RUNNER_TEMP/ub-review-independent-baseline" >> "$GITHUB_ENV"

              - name: Verify exact candidate identity
          '''.replace('              ', '')
          if text.count(marker) != 1:
              raise SystemExit(f'workflow insertion target count={text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          cargo fmt --all

      - name: Verify focused containment contract
        run: cargo test --locked --test self_gate_containment

      - name: Verify workflow with actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/independent-baseline.yml

      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add .github/workflows/independent-baseline.yml tests/self_gate_containment.rs
          git rm .github/workflows/branch-947-fix.yml
          git commit -m "ci(containment): repair independent baseline validation"
          git push origin HEAD:ci/947-independent-baseline
