name: temporary-947-fix-v2

on:
  push:
    branches: [ci/947-independent-baseline]
    paths: [.github/workflows/branch-947-fix-v2.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/947-independent-baseline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair exact actionlint and rustfmt failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/independent-baseline.yml')
          lines = path.read_text().splitlines()
          filtered = [
              line for line in lines
              if not line.lstrip().startswith('CARGO_TARGET_DIR:')
              and not line.lstrip().startswith('RECEIPT_DIR:')
          ]
          marker = '          persist-credentials: false'
          indices = [index for index, line in enumerate(filtered) if line == marker]
          if len(indices) != 1:
              raise SystemExit(f'persist-credentials marker count={len(indices)}')
          index = indices[0] + 1
          step = [
              '',
              '      - name: Set isolated runtime paths',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/ub-review-independent-target" >> "$GITHUB_ENV"',
              '          echo "RECEIPT_DIR=$RUNNER_TEMP/ub-review-independent-baseline" >> "$GITHUB_ENV"',
          ]
          filtered[index:index] = step
          path.write_text('\n'.join(filtered) + '\n')
          PY
          cargo fmt --all

      - name: Verify focused containment contract
        run: cargo test --locked --test self_gate_containment

      - name: Verify workflow with actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/independent-baseline.yml

      - name: Commit bounded repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add .github/workflows/independent-baseline.yml tests/self_gate_containment.rs
          git rm .github/workflows/branch-947-fix.yml .github/workflows/branch-947-fix-v2.yml
          git commit -m "ci(containment): repair independent baseline validation"
          git push origin HEAD:ci/947-independent-baseline
