name: Scratch #1266 promote validated worker authority tree

on:
  push:
    branches:
      - chatgpt/1266-worker-promote

permissions:
  contents: write

concurrency:
  group: ub-review-1266-worker-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PR_HEAD: c1e6872eee908f6f46134a3e0a148b31fd9df555
      PR_BRANCH: codex/956-proof-worker-task-ledger
      SCRATCH_BRANCH: chatgpt/1266-worker-authority-fix
    steps:
      - name: Checkout promotion control branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for validated source-only scratch tree
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          scratch_sha=""
          for _ in $(seq 1 180); do
            git fetch --no-tags origin \
              "+refs/heads/$SCRATCH_BRANCH:refs/remotes/origin/$SCRATCH_BRANCH" \
              "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH"
            scratch_sha="$(git rev-parse "refs/remotes/origin/$SCRATCH_BRANCH")"
            current_pr_head="$(git rev-parse "refs/remotes/origin/$PR_BRANCH")"
            test "$current_pr_head" = "$EXPECTED_PR_HEAD"
            if git show "$scratch_sha:src/main.rs" | grep -q 'fn worker_timeout_sec' \
              && git show "$scratch_sha:src/proof_task_ledger.rs" | grep -q 'fn validate_worker_checkout' \
              && git show "$scratch_sha:src/proof/command.rs" | grep -q 'fn combine_proof_post_run_results' \
              && ! git cat-file -e "$scratch_sha:.github/ub-review-1266-worker-transform.py" 2>/dev/null \
              && ! git cat-file -e "$scratch_sha:.github/workflows/_scratch-1266-worker-source-export.yml" 2>/dev/null \
              && ! git cat-file -e "$scratch_sha:.github/workflows/_scratch-1266-worker-apply.yml" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          changed="$(git diff --name-only "$EXPECTED_PR_HEAD" "$scratch_sha" | sort)"
          expected="$(printf '%s\n' \
            src/main.rs \
            src/proof/command.rs \
            src/proof_task_ledger.rs | sort)"
          test "$changed" = "$expected"
          scratch_tree="$(git rev-parse "$scratch_sha^{tree}")"
          echo "scratch_sha=$scratch_sha" >> "$GITHUB_OUTPUT"
          echo "scratch_tree=$scratch_tree" >> "$GITHUB_OUTPUT"

      - name: Create exact-parent product commit and promote with lease
        id: promote
        shell: bash
        env:
          SCRATCH_SHA: ${{ steps.candidate.outputs.scratch_sha }}
          SCRATCH_TREE: ${{ steps.candidate.outputs.scratch_tree }}
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          promoted_sha="$(printf '%s\n\nValidated source tree: %s\n' \
            'fix(task-ledger): close worker execution authority gaps' \
            "$SCRATCH_SHA" | git commit-tree "$SCRATCH_TREE" -p "$EXPECTED_PR_HEAD")"
          git push origin "$promoted_sha:refs/heads/$PR_BRANCH" \
            --force-with-lease="refs/heads/$PR_BRANCH:$EXPECTED_PR_HEAD"
          echo "promoted_sha=$promoted_sha" >> "$GITHUB_OUTPUT"

      - name: Write promotion receipt
        if: ${{ always() }}
        shell: bash
        env:
          STATUS: ${{ job.status }}
          SCRATCH_SHA: ${{ steps.candidate.outputs.scratch_sha }}
          SCRATCH_TREE: ${{ steps.candidate.outputs.scratch_tree }}
          PROMOTED_SHA: ${{ steps.promote.outputs.promoted_sha }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/ub-review-1266-worker-promotion"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg schema "ub-review.promotion_receipt.v1" \
            --arg status "$STATUS" \
            --arg expected_parent "$EXPECTED_PR_HEAD" \
            --arg scratch_sha "${SCRATCH_SHA:-}" \
            --arg scratch_tree "${SCRATCH_TREE:-}" \
            --arg promoted_sha "${PROMOTED_SHA:-}" \
            '{
              schema: $schema,
              status: $status,
              expected_parent: $expected_parent,
              scratch_sha: $scratch_sha,
              scratch_tree: $scratch_tree,
              promoted_sha: $promoted_sha,
              changed_files: [
                "src/main.rs",
                "src/proof/command.rs",
                "src/proof_task_ledger.rs"
              ]
            }' > "$receipt_dir/receipt.json"

      - name: Upload promotion receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ub-review-1266-worker-promotion-${{ github.sha }}
          path: ${{ runner.temp }}/ub-review-1266-worker-promotion
          if-no-files-found: error
          retention-days: 7
