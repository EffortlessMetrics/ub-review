name: temporary-v2

on:
  push:
    branches: [feat/950-revision-binding]
    paths: [.github/workflows/branch-950-revision-ref-correction-v2.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/950-revision-binding
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply correction and connected fixture updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/branch-950-revision-ref-correction.yml').read_text()
          body = workflow.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(script, 'branch-950-revision-ref-correction.py', 'exec'))

          path = Path('src/claim_graph.rs')
          text = path.read_text()
          old_good = '''        graph.revision = Some(crate::RevisionRef {
                      digest: "a".repeat(64),
                      semantics: "candidate_head".to_owned(),
                      reviewed_commit: "b".repeat(40),
                  });
          '''
          new_good = '''        graph.revision = Some(crate::RevisionRef {
                      digest: "a".repeat(64),
                      semantics: "candidate_head".to_owned(),
                      base_commit: "c".repeat(40),
                      head_commit: "b".repeat(40),
                      reviewed_commit: "b".repeat(40),
                  });
          '''
          old_bad = '''        broken.revision = Some(crate::RevisionRef {
                      digest: "short".to_owned(),
                      semantics: "candidate_head".to_owned(),
                      reviewed_commit: "b".repeat(40),
                  });
          '''
          new_bad = '''        broken.revision = Some(crate::RevisionRef {
                      digest: "short".to_owned(),
                      semantics: "candidate_head".to_owned(),
                      base_commit: "c".repeat(40),
                      head_commit: "b".repeat(40),
                      reviewed_commit: "b".repeat(40),
                  });
          '''
          for label, old, new in [('valid fixture', old_good, new_good), ('invalid fixture', old_bad, new_bad)]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'src/claim_graph.rs: {label} target count {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Focused revision-ref tests
        run: |
          cargo test --locked revision_ref_joins_admission_and_validates_shape
          cargo test --locked stamped_revision_ref_is_visible_in_the_artifact
          cargo test --locked delivery_head_prefers_pr_head_over_reviewed_merge_and_legacy_label

      - name: Verifier self-test
        run: python scripts/verify-bun-review-artifacts.py --self-test

      - name: Full Rust validation
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Policy
        run: cargo xtask policy-check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add src/revision_identity.rs src/revision_admission.rs src/github_delivery.rs src/claim_graph.rs scripts/verify-bun-review-artifacts.py
          git commit -m "fix(revision): separate reviewed commit from delivery head"
          git push origin HEAD:feat/950-revision-binding
