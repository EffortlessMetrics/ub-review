name: temporary-950-revision-authority-probe

on:
  push:
    branches: [fix/950-revision-authority]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/950-revision-authority
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply reviewed correction
        if: ${{ github.event.head_commit.message != 'fix(revision): separate analysis object from delivery head' }}
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick --no-commit df16a6effe5a19cbdd0fe290ccfeb27b988f5178
          python .github/scripts/branch-950-revision-authority.py
      - name: Full validation
        if: ${{ github.event.head_commit.message != 'fix(revision): separate analysis object from delivery head' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          python scripts/verify-bun-review-artifacts.py --self-test
          cargo xtask policy-check
      - name: Commit integrated correction
        if: ${{ github.event.head_commit.message != 'fix(revision): separate analysis object from delivery head' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add scripts/verify-bun-review-artifacts.py src/claim_graph.rs src/github_delivery.rs src/revision_admission.rs src/revision_identity.rs
          git commit -m 'fix(revision): separate analysis object from delivery head'
          git push origin HEAD:fix/950-revision-authority
