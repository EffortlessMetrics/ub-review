name: ub-review/gate

# Disposable #947 negative control. This candidate-owned workflow deliberately
# claims success while the protected-base independent baseline checks the real
# candidate content. The proof PR is closed without merge.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  gate:
    name: ub-review/gate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Claim candidate self-gate success
        run: echo "candidate-owned ub-review/gate deliberately reports success"
