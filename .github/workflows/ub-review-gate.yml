name: ub-review/gate

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  # Temporary on review/golden only. The one-shot repair restores this file
  # from current main before pushing the source commit.
  contents: write
  actions: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: ub-review-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ub-review/gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/golden
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Move the golden harness into the test source tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/golden' && hashFiles('src/review_golden.rs') != ''
        shell: bash
        run: |
          set -euo pipefail
          git mv src/review_golden.rs src/tests/review_golden.rs

          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.rs')
          text = main.read_text(encoding='utf-8')
          old = '#[cfg(test)]\nmod review_golden;\n'
          new = '#[cfg(test)]\n#[path = "tests/review_golden.rs"]\nmod review_golden;\n'
          if text.count(old) != 1:
              raise SystemExit('expected one review_golden module declaration')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/REVIEW_GOLDEN_FIXTURES.md')
          doc_text = docs.read_text(encoding='utf-8')
          if 'src/review_golden.rs' not in doc_text:
              raise SystemExit('golden source path is absent from documentation')
          docs.write_text(
              doc_text.replace('src/review_golden.rs', 'src/tests/review_golden.rs'),
              encoding='utf-8',
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --bin ub-review review_golden -- --test-threads=1
          git diff --check

          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git checkout origin/main -- .github/workflows/ub-review-gate.yml
          git add src/main.rs src/tests/review_golden.rs docs/REVIEW_GOLDEN_FIXTURES.md .github/workflows/ub-review-gate.yml
          git commit -m "test(review): classify golden fixtures as test source"
          git push origin HEAD:review/golden

      - uses: Swatinem/rust-cache@v2
        if: always()
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        if: always()
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run ub-review gate
        if: always()
        uses: ./
        with:
          config: .ub-review.toml
          profile: gh-runner-full
          runtime-profile: gh-runner-full
          mode: intelligent-ci
          run-pass: auto
          allow-heavy: 'true'
          root: .
          base: origin/main
          out: target/ub-review
          github-token: ${{ github.token }}
          posting: artifact-only
          model-mode: auto
          depth: standard
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          minimax-provider-kind: anthropic
          minimax-model: MiniMax-M3
          opencode-api-key: ${{ secrets.OPENCODE }}
          opencode-model: mimo-v2.5
          opencode-endpoint-kind: auto

      - name: Verify ub-review artifacts
        if: always()
        run: >
          python scripts/verify-bun-review-artifacts.py target/ub-review
          --expected-review-profile ub-review-self
          --expected-repo-kind ub-review

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ub-review-gate
          path: target/ub-review
          if-no-files-found: warn
