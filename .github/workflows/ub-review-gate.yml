name: ub-review/gate

# Contained candidate dogfood posture (#946): the pull-request head may still
# build and execute its own Action so we can inspect exact-head packets, but it
# receives no provider credentials, PR/check write authority, or OIDC authority.
# It runs model-off and artifact-only. This is not independent gate authority;
# #947 and the later #876/#814 trust boundary own that progression.
run-name: premerge-v1 ${{ github.event.pull_request.number || '0' }} ${{ github.event.pull_request.head.sha || github.sha }} ${{ github.event.pull_request.base.sha || github.sha }} ${{ github.event.pull_request.base.ref || '-' }} ${{ github.event.action || 'dispatch' }} ${{ github.actor_id }} ${{ github.event.label.name || '-' }}
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, edited, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

# Every job declares its own minimum token permissions. In particular, the
# candidate-controlled gate job does not inherit the coverage uploader's OIDC
# authority.
permissions: {}

concurrency:
  group: ub-review-gate-${{ github.event.action == 'labeled' && startsWith(github.event.label.name, 'ci:') && format('request-{0}', github.event.pull_request.number) || format('observe-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  NATIVE_SHA: ${{ github.sha }}
  ADMISSION_LANE: gate
  ADAPTER_SHA256: 3a6e95347ce402c54dd004158640c0770cf664e7b24c1f107671820ad276627f
  POSSIBLE_ADMISSION: ${{ (github.event.action == 'labeled' && startsWith(github.event.label.name, 'ci:')) || github.event.action == 'synchronize' || github.event.action == 'converted_to_draft' || github.event.action == 'closed' || (github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'ci:')) || (github.event.action == 'edited' && github.event.changes.base != null) || github.event_name == 'pull_request_review' }}

jobs:
  admission:
    name: admission snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      required: ${{ steps.decision.outputs.required }}
      request: ${{ steps.decision.outputs.request }}
    steps:
      - name: Admit one explicit native request
        id: decision
        shell: bash
        env:
          ADMISSION_PHASE: admit
        run: |
          set -euo pipefail
          if [[ "$ADMISSION_PHASE" == admit && "$POSSIBLE_ADMISSION" != true ]]; then
            echo mode=observation >> "$GITHUB_OUTPUT"
            echo required=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ADMISSION_PHASE" == finalize ]]; then
            test "$WORKFLOW_CANCELLED" != true
            case "$ADMISSION_MODE" in
              observation|duplicate|replay) exit 0 ;;
            esac
            test "$ADMISSION_RESULT" = success
            test "$ADMISSION_MODE" = admitted
            test "$PRODUCT_RESULT" = success
          fi
          [[ "$POLICY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Protected main event base only. Never use candidate/default-tip source or a fallback.
          script="$RUNNER_TEMP/premerge-admission.py"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 20 --max-filesize 131072 \
            "https://raw.githubusercontent.com/EffortlessMetrics/ub-review/$POLICY_BASE_SHA/scripts/premerge-admission.py" -o "$script"
          echo "$ADAPTER_SHA256  $script" | sha256sum --check --status
          python3 "$script"

  gate:
    needs: admission
    if: ${{ !cancelled() && needs.admission.result == 'success' && needs.admission.outputs.mode == 'admitted' }}
    name: contained candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Revalidate request before candidate checkout
        shell: bash
        env:
          ADMISSION_PHASE: recheck
          ADMISSION_MODE: ${{ needs.admission.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$ADMISSION_PHASE" == admit && "$POSSIBLE_ADMISSION" != true ]]; then
            echo mode=observation >> "$GITHUB_OUTPUT"
            echo required=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ADMISSION_PHASE" == finalize ]]; then
            test "$WORKFLOW_CANCELLED" != true
            case "$ADMISSION_MODE" in
              observation|duplicate|replay) exit 0 ;;
            esac
            test "$ADMISSION_RESULT" = success
            test "$ADMISSION_MODE" = admitted
            test "$PRODUCT_RESULT" = success
          fi
          [[ "$POLICY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Protected main event base only. Never use candidate/default-tip source or a fallback.
          script="$RUNNER_TEMP/premerge-admission.py"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 20 --max-filesize 131072 \
            "https://raw.githubusercontent.com/EffortlessMetrics/ub-review/$POLICY_BASE_SHA/scripts/premerge-admission.py" -o "$script"
          echo "$ADAPTER_SHA256  $script" | sha256sum --check --status
          python3 "$script"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact native merge checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$NATIVE_SHA"

      - name: Verify task projection regressions
        timeout-minutes: 2
        run: python scripts/test-task-projections.py

      - name: Verify publication boundary regressions
        timeout-minutes: 2
        run: |
          python scripts/test-publication-boundaries.py
          python scripts/test-publication-transaction-completeness.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Keep the Action build separate from sensor/proof Cargo targets.
          cache-directories: ${{ runner.temp }}/ub-review-bootstrap-target
          # Installer changes must not restore an exact old tool cache forever.
          key: bootstrap-v1-${{ hashFiles('action.yml', 'scripts/install-gh-runner-tools.sh') }}

      - name: Verify Action bootstrap contract
        run: python scripts/test-action-bootstrap.py

      # The leased coverage sensor runs `cargo llvm-cov` inside the contained
      # candidate job. Its lcov receipt remains in the uploaded packet.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run contained candidate ub-review gate
        uses: ./
        with:
          # Dogfood the checked-out candidate, never an ambient cached binary.
          install-mode: source
          source-target-dir: ${{ runner.temp }}/ub-review-bootstrap-target
          setup-rust: 'false'
          config: .ub-review.toml
          profile: gh-runner-full
          runtime-profile: gh-runner-full
          mode: intelligent-ci
          run-pass: manual
          # Lease the heavy witness classes so the enabled coverage sensor runs.
          allow-heavy: 'true'
          root: .
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
          # A1.2 (#949): exact PR-head metadata so the synthetic merge checkout
          # is admitted as merge_result instead of failing as ambiguous.
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          out: target/ub-review
          posting: artifact-only
          model-mode: off
          depth: standard

      - name: Verify ub-review artifacts
        if: always()
        run: >
          python scripts/verify-bun-review-artifacts.py target/ub-review
          --expected-review-profile ub-review-self
          --expected-repo-kind ub-review

      # #957 observes contradictions without changing the existing product
      # gate. The regression suite above is enforced; live accounting remains
      # shadow until the authority migration is independently proven.
      - name: Reconcile terminal task projections (shadow)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          python scripts/reconcile-task-projections.py target/ub-review
          --write-report

      # A prepared review is not confirmed GitHub delivery. Keep this
      # comparison shadow-only until #959/#960 own finalization and outcome.
      - name: Reconcile publication boundary (shadow)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          python scripts/reconcile-publication-boundaries.py target/ub-review
          --write-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ub-review-gate
          path: target/ub-review
          if-no-files-found: error

      # Cross-job telemetry needs one LCOV file, not the complete review packet.
      # Absence remains non-blocking; no provider or publishing authority is added.
      - name: Export coverage telemetry
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ub-review-coverage
          path: target/ub-review/sensors/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # Coverage publication remains telemetry, but its OIDC permission is isolated
  # in a job that downloads only LCOV and never checks out or executes the
  # pull-request head. Failure to download or upload remains non-blocking.
  coverage-upload:
    name: coverage telemetry
    needs: [admission, gate]
    if: ${{ !cancelled() && needs.admission.result == 'success' && needs.admission.outputs.mode == 'admitted' && needs.gate.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download coverage telemetry
        id: packet
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: ub-review-coverage
          path: target/ub-review/sensors/coverage

      - name: Upload coverage
        if: steps.packet.outcome == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: target/ub-review/sensors/coverage/lcov.info
          fail_ci_if_error: false

  finalize:
    name: ${{ needs.admission.outputs.required == 'true' && 'ub-review/gate' || (needs.admission.result != 'success' && ((github.event.action == 'labeled' && startsWith(github.event.label.name, 'ci:')) || github.event.action == 'synchronize' || github.event.action == 'converted_to_draft' || github.event.action == 'closed' || (github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'ci:')) || (github.event.action == 'edited' && github.event.changes.base != null) || github.event_name == 'pull_request_review')) && 'ub-review/gate' || 'admission observation / gate' }}
    needs: [admission, gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    env:
      ADMISSION_MODE: ${{ needs.admission.outputs.mode }}
      ADMISSION_RESULT: ${{ needs.admission.result }}
      PRODUCT_RESULT: ${{ needs.gate.result }}
    steps:
      - name: Capture cancellation before finalization
        id: cancellation
        if: ${{ cancelled() }}
        shell: bash
        run: echo cancelled=true >> "$GITHUB_OUTPUT"
      - name: Require current complete uncancelled qualification
        if: ${{ always() }}
        shell: bash
        env:
          ADMISSION_PHASE: finalize
          WORKFLOW_CANCELLED: ${{ steps.cancellation.outputs.cancelled == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$ADMISSION_PHASE" == admit && "$POSSIBLE_ADMISSION" != true ]]; then
            echo mode=observation >> "$GITHUB_OUTPUT"
            echo required=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ADMISSION_PHASE" == finalize ]]; then
            test "$WORKFLOW_CANCELLED" != true
            case "$ADMISSION_MODE" in
              observation|duplicate|replay) exit 0 ;;
            esac
            test "$ADMISSION_RESULT" = success
            test "$ADMISSION_MODE" = admitted
            test "$PRODUCT_RESULT" = success
          fi
          [[ "$POLICY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Protected main event base only. Never use candidate/default-tip source or a fallback.
          script="$RUNNER_TEMP/premerge-admission.py"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 20 --max-filesize 131072 \
            "https://raw.githubusercontent.com/EffortlessMetrics/ub-review/$POLICY_BASE_SHA/scripts/premerge-admission.py" -o "$script"
          echo "$ADAPTER_SHA256  $script" | sha256sum --check --status
          python3 "$script"
      - name: Reject workflow cancellation during finalization
        if: ${{ cancelled() }}
        shell: bash
        run: exit 1
