name: Temporary #956 policy audit

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger
    paths-ignore:
      - .github/ub-review-956-policy-audit.json

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact policy candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download failed exact-head gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9710760865/zip" \
            --output "$RUNNER_TEMP/gate.zip"
          unzip -q "$RUNNER_TEMP/gate.zip" -d "$RUNNER_TEMP/gate"
          find "$RUNNER_TEMP/gate" -name exposure-gaps.json -type f -print -quit | grep .

      - name: Compare reconciliation semantically
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/ub-review-956-policy-audit"
          mkdir -p "$REPORT_DIR"
          export REPORT_DIR
          export GATE_PATH="$(find "$RUNNER_TEMP/gate" -name exposure-gaps.json -type f -print -quit)"
          python - <<'PY'
          from __future__ import annotations

          import collections
          import json
          import os
          import pathlib
          import subprocess
          import tomllib

          CURRENT = pathlib.Path('.ripr/suppressions.toml')
          BASE_SHA = 'df6ece7a2ab46658fa88309d6a39f25feec6af9b'
          TOUCHED = (
              'src_main.rs', 'src/main.rs',
              'src_proof_broker.rs', 'src/proof/broker.rs',
              'src_proof_build.rs', 'src/proof/build.rs',
              'src_proof_command.rs', 'src/proof/command.rs',
              'src_proof_red_green.rs', 'src/proof/red_green.rs',
              'src_proof_task_ledger.rs', 'src/proof_task_ledger.rs',
              'src_sensor_task_ledger.rs', 'src/sensor_task_ledger.rs',
              'src_lane_packets.rs', 'src/lane_packets.rs',
          )

          def parse_toml(text: str) -> list[dict]:
              parsed = tomllib.loads(text)
              rows = parsed.get('suppressions', [])
              if not isinstance(rows, list):
                  raise SystemExit('suppressions must be an array of tables')
              return rows

          def ids(rows: list[dict]) -> list[str]:
              values = []
              for index, row in enumerate(rows):
                  value = row.get('finding_id')
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f'suppression row {index} has no finding_id')
                  values.append(value)
              return values

          current_rows = parse_toml(CURRENT.read_text(encoding='utf-8'))
          base_rows = parse_toml(subprocess.check_output(
              ['git', 'show', f'{BASE_SHA}:.ripr/suppressions.toml'], text=True
          ))
          current_values = ids(current_rows)
          base_values = ids(base_rows)
          current_counts = collections.Counter(current_values)
          base_counts = collections.Counter(base_values)
          current_set = set(current_values)
          base_set = set(base_values)

          gate = json.loads(pathlib.Path(os.environ['GATE_PATH']).read_text(encoding='utf-8'))
          target_values = []
          for entry in gate.get('entries', []):
              value = entry.get('id') or entry.get('finding_id')
              if isinstance(value, str) and value:
                  target_values.append(value)
          target_set = set(target_values)

          added = current_set - base_set
          removed = base_set - current_set
          target_new = target_set - base_set
          target_preexisting = target_set & base_set
          target_missing = target_set - current_set
          unexpected_added = added - target_new
          omitted_additions = target_new - added
          unrelated_removed = {
              value for value in removed if not any(fragment in value for fragment in TOUCHED)
          }
          removed_current_findings = removed & target_set
          duplicate_current = sorted(
              value for value, count in current_counts.items() if count != 1
          )
          duplicate_base = sorted(
              value for value, count in base_counts.items() if count != 1
          )

          added_rows = [row for row in current_rows if row['finding_id'] in added]
          added_owner_counts = collections.Counter(str(row.get('owner', '')) for row in added_rows)
          added_reason_counts = collections.Counter(str(row.get('reason', '')) for row in added_rows)
          malformed_added = [
              row['finding_id']
              for row in added_rows
              if row.get('kind') != 'exposure_gap'
              or not isinstance(row.get('owner'), str)
              or not row.get('owner')
              or not isinstance(row.get('reason'), str)
              or not row.get('reason').strip()
          ]

          failures = {
              'gate_unique_ids': len(target_set) != 492,
              'duplicate_current': bool(duplicate_current),
              'target_missing': bool(target_missing),
              'unexpected_added': bool(unexpected_added),
              'omitted_additions': bool(omitted_additions),
              'unrelated_removed': bool(unrelated_removed),
              'removed_current_findings': bool(removed_current_findings),
              'malformed_added': bool(malformed_added),
          }
          failing = [name for name, failed in failures.items() if failed]

          report = {
              'audit_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'policy_candidate': subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip(),
              'base_policy_sha': BASE_SHA,
              'gate_artifact_id': 9710760865,
              'passed': not failing,
              'failing_checks': failing,
              'counts': {
                  'base_rows': len(base_rows),
                  'current_rows': len(current_rows),
                  'base_unique_ids': len(base_set),
                  'current_unique_ids': len(current_set),
                  'gate_entries': len(target_values),
                  'gate_unique_ids': len(target_set),
                  'target_preexisting': len(target_preexisting),
                  'target_new': len(target_new),
                  'added': len(added),
                  'removed': len(removed),
              },
              'duplicate_current': duplicate_current,
              'duplicate_base': duplicate_base,
              'target_missing': sorted(target_missing),
              'unexpected_added': sorted(unexpected_added),
              'omitted_additions': sorted(omitted_additions),
              'unrelated_removed': sorted(unrelated_removed),
              'removed_current_findings': sorted(removed_current_findings),
              'malformed_added': sorted(malformed_added),
              'added_owner_counts': dict(sorted(added_owner_counts.items())),
              'added_reason_counts': [
                  {'reason': reason, 'count': count}
                  for reason, count in sorted(
                      added_reason_counts.items(), key=lambda item: (-item[1], item[0])
                  )
              ],
              'added_ids': sorted(added),
              'removed_ids': sorted(removed),
          }
          rendered = json.dumps(report, indent=2, sort_keys=True) + '\n'
          report_path = pathlib.Path(os.environ['REPORT_DIR']) / 'policy-audit.json'
          report_path.write_text(rendered, encoding='utf-8')
          pathlib.Path('.github/ub-review-956-policy-audit.json').write_text(
              rendered, encoding='utf-8'
          )

          summary = {
              'passed': report['passed'],
              'failing_checks': failing,
              'counts': report['counts'],
              'duplicate_current': len(duplicate_current),
              'target_missing': len(target_missing),
              'unexpected_added': len(unexpected_added),
              'omitted_additions': len(omitted_additions),
              'unrelated_removed': len(unrelated_removed),
              'removed_current_findings': len(removed_current_findings),
              'malformed_added': len(malformed_added),
              'added_owner_counts': report['added_owner_counts'],
              'distinct_added_reasons': len(added_reason_counts),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"passed={'true' if report['passed'] else 'false'}\n")
          PY

      - name: Publish audit receipt to exact branch
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/956-proof-worker-task-ledger'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add .github/ub-review-956-policy-audit.json
          git commit -m 'ci: publish #956 policy audit'
          git push origin "HEAD:${branch}"

      - name: Upload semantic audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ub-review-956-policy-audit-${{ github.sha }}
          path: ${{ runner.temp }}/ub-review-956-policy-audit
          if-no-files-found: error
          retention-days: 1

      - name: Enforce semantic audit
        if: steps.audit.outputs.passed != 'true'
        shell: bash
        run: exit 1
