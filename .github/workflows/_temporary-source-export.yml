name: Temporary proof adapter apply

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          if compgen -G '.github/ub-review-proof-adapter.patch.*' >/dev/null; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ub-review-proof-adapter.patch.* > /tmp/ub-review-proof-adapter.patch
          printf '%s  %s\n' '56c353c0f0947cd9c9e119db02da5faa4fa7e2def14a5a08daee571077252bf8' /tmp/ub-review-proof-adapter.patch | sha256sum --check --strict
          git apply --index /tmp/ub-review-proof-adapter.patch
          git rm .github/ub-review-proof-adapter.patch.*
          git rm .github/workflows/_temporary-source-export.yml
          printf '%s\n' 'proof adapter applied from 56c353c0f0947cd9c9e119db02da5faa4fa7e2def14a5a08daee571077252bf8' > .github/proof-adapter-applied
          git add .github/proof-adapter-applied
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'runtime(task-ledger): observe proof execution in shadow'
          git push origin HEAD:codex/956-proof-worker-task-ledger
