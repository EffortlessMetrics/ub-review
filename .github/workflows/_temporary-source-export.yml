name: Temporary #956 apply and validation
# Validation trigger for simplified proof adapter head 60267099477c84d6f34c79ab6b0f7d6ca6ef2622.

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      patch_state: ${{ steps.detect.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.github/ub-review-proof-adapter.patch.*)
          if [[ -f .github/proof_task_ledger.rs.gz.b64 ]]; then
            echo 'state=source' >> "$GITHUB_OUTPUT"
          elif [[ ${#chunks[@]} -eq 0 ]]; then
            echo 'state=none' >> "$GITHUB_OUTPUT"
          elif [[ -f .github/ub-review-proof-adapter.patch.00 && ${#chunks[@]} -eq 1 ]]; then
            echo 'state=ready' >> "$GITHUB_OUTPUT"
          else
            echo 'state=partial' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.state == 'source'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'c6240757b0701eb3011ac62da88330fe5afe3e620de6d58605840277806b0a8e' .github/proof_task_ledger.rs.gz.b64 | sha256sum --check --strict
          base64 --decode .github/proof_task_ledger.rs.gz.b64 | gzip --decompress > src/proof_task_ledger.rs
          printf '%s  %s\n' '06e85e6ed4679c23657f7e818ca7f4041c82716951d9214687441f436543bc68' src/proof_task_ledger.rs | sha256sum --check --strict
          git add src/proof_task_ledger.rs
          git rm .github/proof_task_ledger.rs.gz.b64
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'runtime(task-ledger): add the proof execution adapter'
          git push origin HEAD:codex/956-proof-worker-task-ledger
      - if: steps.detect.outputs.state == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ub-review-proof-adapter.patch.* > /tmp/ub-review-proof-adapter.patch
          printf '%s  %s\n' 'd49c7c2df64b7756bf6f6fa5ad3ef347fa45db959cd0bb8ab10375f956372f5d' /tmp/ub-review-proof-adapter.patch | sha256sum --check --strict
          git apply --index /tmp/ub-review-proof-adapter.patch
          git rm .github/ub-review-proof-adapter.patch.*
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'refactor(proof): inline single-use task runners'
          git push origin HEAD:codex/956-proof-worker-task-ledger

  validate:
    needs: apply
    if: needs.apply.outputs.patch_state == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format and validate the proof TaskLedger slice
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            cargo fmt --all
            git diff --check
            git diff --binary > validation/formatted.patch
            cargo fmt --all -- --check
            cargo check --locked --all-targets --all-features
            cargo test --locked --all-targets proof_task_ledger
            cargo test --locked --all-targets proof::command
            cargo test --locked --all-targets proof::red_green
            cargo test --locked --all-targets proof::build
            cargo test --locked --all-targets proof::broker
            cargo test --locked --all-targets sensor_task_ledger
            cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            cargo xtask policy-check
          } 2>&1 | tee validation/validation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-task-ledger-validation-${{ github.sha }}
          path: validation
          if-no-files-found: error
          retention-days: 1

  export:
    needs: apply
    if: needs.apply.outputs.patch_state == 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/upload-artifact@v7
        with:
          name: ub-review-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !target/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
