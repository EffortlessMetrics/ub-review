name: Temporary #956 finalizer

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

concurrency:
  group: ub-review-956-finalizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Apply, format, validate, and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p validation

          chunks=(.github/ub-review-authority-repair.patch.*)
          if [[ ${#chunks[@]} -gt 0 ]]; then
            if [[ ${#chunks[@]} -ne 5 || ! -f .github/ub-review-authority-repair.patch.04 ]]; then
              printf 'Incomplete staged authority patch: %s chunk(s)\n' "${#chunks[@]}" >&2
              exit 1
            fi
            if ! grep -q 'fn run_worker_request_with_runner' src/main.rs; then
              cat "${chunks[@]}" > /tmp/ub-review-authority-repair.patch
              sha256sum /tmp/ub-review-authority-repair.patch
              git apply --check --verbose /tmp/ub-review-authority-repair.patch
              git apply /tmp/ub-review-authority-repair.patch
            fi
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('src/proof_task_ledger.rs')
          text = path.read_text()
          coupled = '            required: request.priority == "high",\n'
          if coupled in text:
              text = text.replace(coupled, '            required: false,\n', 1)
          if '            required: false,\n' not in text:
              raise SystemExit('worker task requirement is not explicitly optional')
          anchor = '        ensure!(worker.source() == TaskSource::Worker);\n'
          assertion = '        ensure!(!worker.required);\n'
          if anchor not in text:
              raise SystemExit('worker source assertion anchor is missing')
          if assertion not in text:
              text = text.replace(anchor, anchor + assertion, 1)
          path.write_text(text)
          PY

          rm -f .github/ub-review-authority-repair.patch.*
          rm -f .github/ub-review-authority-source.b64.*
          rm -f .github/proof_task_ledger.rs.gz.b64
          rm -f .github/ub-review-proof-adapter.patch.*
          rm -f .github/validation-trigger-*.txt
          rm -f .github/workflows/_temporary-source-export.yml
          rm -f .github/workflows/_temporary-authority-apply.yml
          rm -f .github/workflows/_temporary-finalize-956.yml

          {
            cargo fmt --all
            git diff --check
            cargo fmt --all -- --check
            cargo check --locked --all-targets --all-features
            cargo test --locked --all-targets proof_task_ledger
            cargo test --locked --all-targets worker_proof_tests
            cargo test --locked --all-targets proof::command
            cargo test --locked --all-targets proof::red_green
            cargo test --locked --all-targets proof::build
            cargo test --locked --all-targets proof::broker
            cargo test --locked --all-targets sensor_task_ledger
            cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            cargo xtask policy-check
          } 2>&1 | tee validation/validation.log

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Exact source tree is already finalized.'
            exit 0
          fi
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(task-ledger): finalize proof and worker authority'
          git push origin HEAD:codex/956-proof-worker-task-ledger
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-task-ledger-finalizer-${{ github.sha }}
          path: validation
          if-no-files-found: warn
          retention-days: 1
