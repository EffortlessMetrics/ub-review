name: Complete tokmd 1.15 pin upgrade

on:
  push:
    branches:
      - chore/tokmd-1.15

permissions:
  contents: write

jobs:
  rewrite-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v5
        with:
          ref: chore/tokmd-1.15
          fetch-depth: 0

      - name: Align tokmd pin contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("tests/cli.rs"),
              Path("src/sensors/mod.rs"),
              Path("xtask/src/main.rs"),
              Path("docs/RUNNER_IMAGE.md"),
              Path("docs/GH_RUNNER_BUN.md"),
              Path("docs/specs/UB-REVIEW-SPEC-0010-release-install.md"),
              Path("docs/specs/UB-REVIEW-SPEC-0005-sensor-tool-integration.md"),
              Path("docs/specs/UB-REVIEW-SPEC-0009-bun-ub-preset.md"),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count("1.12.0")
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one tokmd 1.12.0 contract reference")
              path.write_text(text.replace("1.12.0", "1.15.0"), encoding="utf-8")
              print(f"{path}: replaced {count} occurrence(s)")
          PY

          if git grep -n '1\.12\.0' -- \
            tests/cli.rs \
            src/sensors/mod.rs \
            xtask/src/main.rs \
            docs/RUNNER_IMAGE.md \
            docs/GH_RUNNER_BUN.md \
            docs/specs/UB-REVIEW-SPEC-0010-release-install.md \
            docs/specs/UB-REVIEW-SPEC-0005-sensor-tool-integration.md \
            docs/specs/UB-REVIEW-SPEC-0009-bun-ub-preset.md; then
            echo "tokmd 1.12.0 remains in a live contract" >&2
            exit 1
          fi

          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add \
            tests/cli.rs \
            src/sensors/mod.rs \
            xtask/src/main.rs \
            docs/RUNNER_IMAGE.md \
            docs/GH_RUNNER_BUN.md \
            docs/specs/UB-REVIEW-SPEC-0010-release-install.md \
            docs/specs/UB-REVIEW-SPEC-0005-sensor-tool-integration.md \
            docs/specs/UB-REVIEW-SPEC-0009-bun-ub-preset.md
          git rm .github/workflows/tokmd-pin-upgrade.yml
          git commit -m "test: align tokmd pin contracts with 1.15.0"
          git push origin HEAD:chore/tokmd-1.15
