name: golden-canonical-test-path

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  move:
    if: github.event.pull_request.head.ref == 'review/golden'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/golden
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Move harness to the canonical non-production test path
        shell: bash
        run: |
          set -euo pipefail
          git mv src/tests/review_golden.rs src/tests.rs

          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.rs')
          text = main.read_text(encoding='utf-8')
          old = '#[cfg(test)]\n#[path = "tests/review_golden.rs"]\nmod review_golden;\n'
          new = '#[cfg(test)]\n#[path = "tests.rs"]\nmod review_golden;\n'
          if text.count(old) != 1:
              raise SystemExit('expected one review_golden path registration')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/REVIEW_GOLDEN_FIXTURES.md')
          doc_text = docs.read_text(encoding='utf-8')
          if 'src/tests/review_golden.rs' not in doc_text:
              raise SystemExit('old golden source path is absent from documentation')
          docs.write_text(
              doc_text.replace('src/tests/review_golden.rs', 'src/tests.rs'),
              encoding='utf-8',
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --bin ub-review review_golden -- --test-threads=1
          git diff --check

          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git rm .github/workflows/golden-canonical-test-path.yml
          git add src/main.rs src/tests.rs docs/REVIEW_GOLDEN_FIXTURES.md
          git commit -m "test(review): use ripr's canonical test-source path"
          git push origin HEAD:review/golden
