name: temporary PR 1241 repair

on:
  push:
    branches:
      - codex/893-source-lockfile

permissions:
  contents: write

concurrency:
  group: temporary-pr-1241-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Apply bounded proof repair
        env:
          MAIN_BLOCK_B64: 
          RUST_TEST_B64: 
          SHELL_FIXTURE_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import os
          from pathlib import Path

          main = Path("src/main.rs")
          text = main.read_text()
          start_marker = "    #[test]\n    fn ub_review_gate_workflow_matches_self_profile_post_policy()"
          end_marker = "\n    #[test]\n    fn ub_review_self_profile_loads_baseline_gate_tools()"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("stale self-gate assertion block is missing")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("self-gate assertion end marker is missing")
          replacement = base64.b64decode(os.environ["MAIN_BLOCK_B64"]).decode()
          main.write_text(text[:start] + replacement + text[end:])

          test = Path("tests/action_source_lockfile.rs")
          test.write_bytes(base64.b64decode(os.environ["RUST_TEST_B64"]))
          fixture = Path("tests/fixtures/action-source-lockfile.sh")
          fixture.parent.mkdir(parents=True, exist_ok=True)
          fixture.write_bytes(base64.b64decode(os.environ["SHELL_FIXTURE_B64"]))
          PYCODE

          cargo fmt --all
          bash -n tests/fixtures/action-source-lockfile.sh
          cargo test --locked --test action_source_lockfile
          cargo test --locked -p ub-review --bin ub-review             ub_review_gate_workflow_uses_contained_candidate_posture -- --exact
          git diff --check

          python - <<'PYCODE'
          import subprocess
          expected = {
              "src/main.rs",
              "tests/action_source_lockfile.rs",
              "tests/fixtures/action-source-lockfile.sh",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected repair surface: {sorted(changed)}")
          PYCODE

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add src/main.rs tests/action_source_lockfile.rs             tests/fixtures/action-source-lockfile.sh
          git commit -m "test(ci): align source lock proof with contained gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
