name: ub-review/independent-baseline

# Temporary self-hosting containment (#947). `pull_request_target` loads this
# workflow from the protected base branch, then checks out the exact candidate
# SHA only in isolated deterministic evidence jobs. A fresh no-checkout job
# aggregates GitHub-owned job results, writes the receipt, and enforces the
# outcome. This is not the full hostile-head-safe coordinator boundary.
on:
  workflow_call:
    inputs:
      base_sha:
        description: Exact native integration base B.
        type: string
        required: true
      group_sha:
        description: Exact native merge-group G.
        type: string
        required: true
      definition_sha:
        description: Reviewed immutable reusable workflow commit pinned by the caller.
        type: string
        required: true
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: ub-review-independent-baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: independent evidence / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, check, clippy, test, doc, policy, verifier]
    env:
      CANDIDATE_REPOSITORY: ${{ github.event_name == 'merge_group' && github.repository || github.event.pull_request.head.repo.full_name }}
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ inputs.base_sha }}
      EVENT_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      EVENT_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
      CALLER_SHA: ${{ github.sha }}
      DEFINITION_SHA: ${{ inputs.definition_sha }}
      CANDIDATE_SHA: ${{ github.event_name == 'merge_group' && inputs.group_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event_name == 'merge_group' && github.repository || github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event_name == 'merge_group' && inputs.group_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == merge_group ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$BASE_SHA" != "$CANDIDATE_SHA" && "$BASE_SHA" == "$EVENT_BASE_SHA" && "$CANDIDATE_SHA" == "$EVENT_GROUP_SHA" && "$CANDIDATE_SHA" == "$CALLER_SHA" ]]
            git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          elif [[ "$EVENT_NAME" != pull_request_target ]]; then
            echo "independent baseline requires its native PR target or merge-group subject" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "expected candidate $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi

      - name: Install fixed Rust toolchain
        if: ${{ matrix.check != 'verifier' }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install fixed Python toolchain
        if: ${{ matrix.check == 'verifier' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run one fixed deterministic check
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ub-review-independent-${CHECK}-target"
          case "$CHECK" in
            fmt)
              cargo fmt --all -- --check
              ;;
            check)
              cargo check --workspace --all-targets --locked
              ;;
            clippy)
              cargo clippy --workspace --all-targets --locked -- -D warnings
              ;;
            test)
              cargo test --workspace --all-targets --locked
              ;;
            doc)
              cargo doc --workspace --no-deps --locked
              ;;
            policy)
              cargo run --locked --package xtask -- policy-check
              ;;
            verifier)
              python scripts/verify-bun-review-artifacts.py --self-test
              ;;
            *)
              echo "unknown independent baseline check: $CHECK" >&2
              exit 2
              ;;
          esac

  finalize:
    name: ub-review/independent-baseline
    needs: evidence
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_REPOSITORY: ${{ github.event_name == 'merge_group' && github.repository || github.event.pull_request.head.repo.full_name }}
      CANDIDATE_SHA: ${{ github.event_name == 'merge_group' && inputs.group_sha || github.event.pull_request.head.sha }}
      EVIDENCE_RESULT: ${{ needs.evidence.result }}
      TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ inputs.base_sha }}
      EVENT_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      EVENT_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
      DEFINITION_SHA: ${{ inputs.definition_sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # This job never checks out candidate code. Its read-only token observes
      # native run metadata; the App must independently bind the reviewed caller
      # generation and this literal reusable reference before accepting G.
      - name: Write trusted exact-head baseline receipt
        shell: bash
        env:
          METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY_RECEIPT'
          import json, os, pathlib, re, urllib.request
          e = os.environ
          candidate = e["CANDIDATE_SHA"]
          definition = e["TRUSTED_WORKFLOW_SHA"]
          source = "protected-base"
          group = e["EVENT_NAME"] == "merge_group"
          reference = None
          if group:
              definition = e["DEFINITION_SHA"]
              if not all(re.fullmatch(r"[0-9a-f]{40}", e[k]) for k in ("BASE_SHA", "CANDIDATE_SHA", "DEFINITION_SHA")):
                  raise SystemExit("integration subjects and pinned definition must be exact commits")
              if not (e["BASE_SHA"] == e["EVENT_BASE_SHA"] != candidate == e["EVENT_GROUP_SHA"] == e["TRUSTED_WORKFLOW_SHA"]):
                  raise SystemExit("integration event identity changed")
              path = e["REPOSITORY"] + "/.github/workflows/independent-baseline.yml@" + definition
              url = "https://api.github.com/repos/" + e["REPOSITORY"] + "/actions/runs/" + e["RUN_ID"] + "/attempts/" + e["RUN_ATTEMPT"]
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + e["METADATA_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if not (run.get("id") == int(e["RUN_ID"]) and run.get("run_attempt") == int(e["RUN_ATTEMPT"]) and run.get("head_sha") == candidate and run.get("event") == "merge_group" and run.get("repository", {}).get("full_name") == e["REPOSITORY"]):
                  raise SystemExit("native run/attempt is not this integration subject")
              refs = [w for w in run.get("referenced_workflows", []) if w.get("path") == path and w.get("sha") == definition]
              if len(refs) != 1:
                  raise SystemExit("reviewed immutable baseline reference is missing or ambiguous")
              reference = refs[0]
              source = "reviewed-immutable-reusable-reference"
          elif e["EVENT_NAME"] != "pull_request_target":
              raise SystemExit("unsupported independent baseline origin")
          receipt = {
              "schema": "ub-review.independent_baseline.v2" if group else "ub-review.independent_baseline.v1",
              "candidate_repository": e["CANDIDATE_REPOSITORY"],
              "candidate_sha": candidate,
              "trusted_workflow_sha": definition,
              "workflow_source": source,
              "evidence_topology": "isolated-matrix-jobs",
              "evidence_result": e["EVIDENCE_RESULT"],
              "commands": [
                  "cargo fmt --all -- --check",
                  "cargo check --workspace --all-targets --locked",
                  "cargo clippy --workspace --all-targets --locked -- -D warnings",
                  "cargo test --workspace --all-targets --locked",
                  "cargo doc --workspace --no-deps --locked",
                  "cargo run --locked --package xtask -- policy-check",
                  "python scripts/verify-bun-review-artifacts.py --self-test",
              ],
          }
          if group:
              receipt.update(base_sha=e["BASE_SHA"], group_sha=candidate, run_id=int(e["RUN_ID"]), run_attempt=int(e["RUN_ATTEMPT"]), referenced_workflow=reference,
                             authority_join="requires publisher validation of reviewed caller and producer closure; a run-level reusable reference alone does not prove job-source custody")
          directory = pathlib.Path(e["RUNNER_TEMP"]) / "ub-review-independent-baseline"
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY_RECEIPT

      - name: Upload independent baseline receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'merge_group' && inputs.group_sha || github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ub-review-independent-baseline
          if-no-files-found: error
          retention-days: 7

      - name: Enforce independent baseline
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVIDENCE_RESULT" != "success" ]]; then
            echo "independent baseline evidence ended $EVIDENCE_RESULT for exact candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
