name: Temporary #956 authority apply

on:
  push:
    branches:
      - codex/956-proof-worker-task-ledger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply the audited authority repair
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/ub-review-authority-repair.patch.*)
          if [[ ${#chunks[@]} -eq 0 ]]; then
            echo 'No staged patch remains; nothing to apply.'
            exit 0
          fi
          if [[ ${#chunks[@]} -ne 5 || ! -f .github/ub-review-authority-repair.patch.04 ]]; then
            printf 'Incomplete staged patch: %s chunk(s)\n' "${#chunks[@]}" >&2
            exit 1
          fi
          cat "${chunks[@]}" > /tmp/ub-review-authority-repair.patch
          sha256sum /tmp/ub-review-authority-repair.patch
          git apply --check --verbose /tmp/ub-review-authority-repair.patch
          git apply --index /tmp/ub-review-authority-repair.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('src/proof_task_ledger.rs')
          text = path.read_text()
          old = '            required: request.priority == "high",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one worker priority/requirement coupling, found {text.count(old)}')
          text = text.replace(old, '            required: false,\n')
          anchor = '        ensure!(worker.source() == TaskSource::Worker);\n        Ok(())\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one worker source assertion anchor, found {text.count(anchor)}')
          text = text.replace(
              anchor,
              '        ensure!(worker.source() == TaskSource::Worker);\n        ensure!(!worker.required);\n        Ok(())\n',
          )
          path.write_text(text)
          PY
          git add src/proof_task_ledger.rs
          git rm .github/ub-review-authority-repair.patch.*
          git rm -f .github/validation-trigger-d192c61.txt
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(task-ledger): retain worker and cleanup authority'
          git push origin HEAD:codex/956-proof-worker-task-ledger
