# DORMANT CANDIDATE: release/ci owner review and explicit cutover required.
name: ub-review/gate

# Contained candidate dogfood posture (#946): the pull-request head may still
# build and execute its own Action so we can inspect exact-head packets, but it
# receives no provider credentials, PR/check write authority, or OIDC authority.
# It runs model-off and artifact-only. This is not independent gate authority;
# #947 and the later #876/#814 trust boundary own that progression.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, converted_to_draft, edited, closed]

  workflow_dispatch:

# Every job declares its own minimum token permissions. In particular, the
# candidate-controlled gate job does not inherit the coverage uploader's OIDC
# authority.
permissions: {}

# Preserve active qualification; irrelevant events get independent cheap runs.
# Native pending replacement is not the complete #1288 terminal-accounting contract.
concurrency:
  group: ub-review-gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && 'qualification' || format('observe-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  admission:
    name: current admission snapshot
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PR: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EXPECTED_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      EXPECTED_UPDATED: ${{ github.event.pull_request.updated_at }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
    steps:
      - name: Check fresh label edge against live PR
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = labeled
          test "${EVENT_LABEL,,}" = merge-ready
          test -n "$EXPECTED_PR"
          # Never execute candidate files or accept a caller-selected API endpoint.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > "$RUNNER_TEMP/admission-live-pr.json"
          jq -e \
            --arg head "$EXPECTED_HEAD" --arg head_repo "$EXPECTED_HEAD_REPO" \
            --arg base "$EXPECTED_BASE" --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_repo "$EXPECTED_BASE_REPO" --arg updated "$EXPECTED_UPDATED" \
            '.state == "open" and .draft == false and
             .head.sha == $head and .head.repo.full_name == $head_repo and
             .base.sha == $base and .base.ref == $base_ref and .base.repo.full_name == $base_repo and
             .updated_at == $updated and
             any(.labels[]; (.name | ascii_downcase) == "merge-ready")' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null

  gate:
    needs: admission
    if: ${{ always() && (needs.admission.result == 'success' || github.event_name == 'workflow_dispatch') }}
    name: contained candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify task projection regressions
        timeout-minutes: 2
        run: python scripts/test-task-projections.py

      - name: Verify publication boundary regressions
        timeout-minutes: 2
        run: |
          python scripts/test-publication-boundaries.py
          python scripts/test-publication-transaction-completeness.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Keep the Action build separate from sensor/proof Cargo targets.
          cache-directories: ${{ runner.temp }}/ub-review-bootstrap-target
          # Installer changes must not restore an exact old tool cache forever.
          key: bootstrap-v1-${{ hashFiles('action.yml', 'scripts/install-gh-runner-tools.sh') }}

      - name: Verify Action bootstrap contract
        run: python scripts/test-action-bootstrap.py

      # The leased coverage sensor runs `cargo llvm-cov` inside the contained
      # candidate job. Its lcov receipt remains in the uploaded packet.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run contained candidate ub-review gate
        uses: ./
        with:
          # Dogfood the checked-out candidate, never an ambient cached binary.
          install-mode: source
          source-target-dir: ${{ runner.temp }}/ub-review-bootstrap-target
          setup-rust: 'false'
          config: .ub-review.toml
          profile: gh-runner-full
          runtime-profile: gh-runner-full
          mode: intelligent-ci
          run-pass: auto
          # Lease the heavy witness classes so the enabled coverage sensor runs.
          allow-heavy: 'true'
          root: .
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
          # A1.2 (#949): exact PR-head metadata so the synthetic merge checkout
          # is admitted as merge_result instead of failing as ambiguous.
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          out: target/ub-review
          posting: artifact-only
          model-mode: off
          depth: ${{ github.event_name == 'workflow_dispatch' && 'deep' || 'standard' }}

      - name: Verify ub-review artifacts
        if: always()
        run: >
          python scripts/verify-bun-review-artifacts.py target/ub-review
          --expected-review-profile ub-review-self
          --expected-repo-kind ub-review

      # #957 observes contradictions without changing the existing product
      # gate. The regression suite above is enforced; live accounting remains
      # shadow until the authority migration is independently proven.
      - name: Reconcile terminal task projections (shadow)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          python scripts/reconcile-task-projections.py target/ub-review
          --write-report

      # A prepared review is not confirmed GitHub delivery. Keep this
      # comparison shadow-only until #959/#960 own finalization and outcome.
      - name: Reconcile publication boundary (shadow)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          python scripts/reconcile-publication-boundaries.py target/ub-review
          --write-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ub-review-gate
          path: target/ub-review
          if-no-files-found: error

      # Cross-job telemetry needs one LCOV file, not the complete review packet.
      # Absence remains non-blocking; no provider or publishing authority is added.
      - name: Export coverage telemetry
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ub-review-coverage
          path: target/ub-review/sensors/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # Coverage publication remains telemetry, but its OIDC permission is isolated
  # in a job that downloads only LCOV and never checks out or executes the
  # pull-request head. Failure to download or upload remains non-blocking.
  coverage-upload:
    name: coverage telemetry
    needs: gate
    if: ${{ needs.gate.result != 'skipped' && always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download coverage telemetry
        id: packet
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: ub-review-coverage
          path: target/ub-review/sensors/coverage

      - name: Upload coverage
        if: steps.packet.outcome == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: target/ub-review/sensors/coverage/lcov.info
          fail_ci_if_error: false

  admission-result:
    name: ub-review/gate
    needs: [admission, gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PR: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EXPECTED_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      EXPECTED_UPDATED: ${{ github.event.pull_request.updated_at }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVIDENCE_RESULT: ${{ needs.gate.result }}
    steps:
      - name: Require current admitted successful candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDENCE_RESULT" = success
          test "$EVENT_ACTION" = labeled
          test "${EVENT_LABEL,,}" = merge-ready
          test -n "$EXPECTED_PR"
          # Never execute candidate files or accept a caller-selected API endpoint.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > "$RUNNER_TEMP/admission-live-pr.json"
          jq -e \
            --arg head "$EXPECTED_HEAD" --arg head_repo "$EXPECTED_HEAD_REPO" \
            --arg base "$EXPECTED_BASE" --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_repo "$EXPECTED_BASE_REPO" --arg updated "$EXPECTED_UPDATED" \
            '.state == "open" and .draft == false and
             .head.sha == $head and .head.repo.full_name == $head_repo and
             .base.sha == $base and .base.ref == $base_ref and .base.repo.full_name == $base_repo and
             .updated_at == $updated and
             any(.labels[]; (.name | ascii_downcase) == "merge-ready")' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null
