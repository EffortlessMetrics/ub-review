# DORMANT CANDIDATE: release/ci owner review and explicit cutover required.
name: ub-review/independent-baseline

# Temporary self-hosting containment (#947). `pull_request_target` loads this
# workflow from the protected base branch, then checks out the exact candidate
# SHA only in isolated deterministic evidence jobs. A fresh no-checkout job
# aggregates GitHub-owned job results, writes the receipt, and enforces the
# outcome. This is not the full hostile-head-safe coordinator boundary.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, converted_to_draft, edited, closed]

permissions:
  contents: read

# Preserve active qualification; irrelevant events get independent cheap runs.
# Native pending replacement is not the complete #1288 terminal-accounting contract.
concurrency:
  group: ub-review-independent-baseline-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && 'qualification' || format('observe-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  admission:
    name: current admission snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      admitted: ${{ steps.current.outputs.admitted }}
      observation: ${{ steps.current.outputs.observation }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PR: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EXPECTED_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVENT_RETARGET: ${{ github.event.changes.base != null }}
      EVENT_REVIEW_STATE: ${{ github.event.review.state }}
    steps:
      - name: Classify event and check current PR
        id: current
        shell: bash
        run: |
          set -euo pipefail
          observation() { echo observation=true >> "$GITHUB_OUTPUT"; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            observation
            exit 0
          fi
          # Metadata-only events need no API read and cannot invalidate proof on an API outage.
          if [[ "$EVENT_NAME" == pull_request_review && "$EVENT_REVIEW_STATE" == commented ]] ||
             [[ "$EVENT_NAME" != pull_request_review && ( ( "$EVENT_ACTION" == labeled || "$EVENT_ACTION" == unlabeled ) && "${EVENT_LABEL,,}" != merge-ready ) ]] ||
             [[ "$EVENT_NAME" != pull_request_review && "$EVENT_ACTION" == edited && "$EVENT_RETARGET" != true ]]; then
            observation
            exit 0
          fi
          test -n "$EXPECTED_PR"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > "$RUNNER_TEMP/admission-live-pr.json"
          gh pr view "$EXPECTED_PR" --repo "$GITHUB_REPOSITORY" --json reviewDecision > "$RUNNER_TEMP/admission-review.json"
          # Native reviewDecision preserves GitHub's review aggregation semantics.
          jq -e 'has("reviewDecision") and (.reviewDecision == null or
            .reviewDecision == "APPROVED" or .reviewDecision == "REVIEW_REQUIRED" or
            .reviewDecision == "CHANGES_REQUESTED")' "$RUNNER_TEMP/admission-review.json" > /dev/null
          jq -e 'type == "object" and (.head.sha | type == "string") and
            (.head.repo.full_name | type == "string") and (.base.sha | type == "string") and
            (.base.ref | type == "string") and (.base.repo.full_name | type == "string") and
            (.state | type == "string") and (.draft | type == "boolean") and
            (.labels | type == "array")' "$RUNNER_TEMP/admission-live-pr.json" > /dev/null
          # A late event for a superseded material subject cannot replace current proof.
          if ! jq -e \
            --arg head "$EXPECTED_HEAD" --arg head_repo "$EXPECTED_HEAD_REPO" \
            --arg base "$EXPECTED_BASE" --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_repo "$EXPECTED_BASE_REPO" \
            '.head.sha == $head and .head.repo.full_name == $head_repo and
             .base.sha == $base and .base.ref == $base_ref and .base.repo.full_name == $base_repo' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null; then
            observation
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request_review ]]; then
            if jq -e '.reviewDecision != "CHANGES_REQUESTED"' "$RUNNER_TEMP/admission-review.json" > /dev/null; then
              observation
            fi
            exit 0
          fi
          case "$EVENT_ACTION" in
            labeled|unlabeled)
              if [[ "${EVENT_LABEL,,}" != merge-ready ]]; then
                observation
                exit 0
              fi
              if [[ "$EVENT_ACTION" == unlabeled ]]; then
                # A delayed withdrawal after reapplication is only an observation.
                if jq -e 'any(.labels[]; (.name | ascii_downcase) == "merge-ready")' "$RUNNER_TEMP/admission-live-pr.json" > /dev/null; then
                  observation
                fi
                exit 0
              fi
              ;;
            edited)
              if [[ "$EVENT_RETARGET" != true ]]; then observation; fi
              exit 0
              ;;
            converted_to_draft)
              if jq -e '.draft == false' "$RUNNER_TEMP/admission-live-pr.json" > /dev/null; then observation; fi
              exit 0
              ;;
            closed)
              if jq -e '.state == "open"' "$RUNNER_TEMP/admission-live-pr.json" > /dev/null; then observation; fi
              exit 0
              ;;
            synchronize|opened|reopened|ready_for_review)
              # These need a fresh label edge; never allocate heavy proof here.
              exit 0
              ;;
            *) observation; exit 0 ;;
          esac
          jq -e '.state == "open" and .draft == false and
            any(.labels[]; (.name | ascii_downcase) == "merge-ready")' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null
          jq -e '.reviewDecision != "CHANGES_REQUESTED"' "$RUNNER_TEMP/admission-review.json" > /dev/null
          echo admitted=true >> "$GITHUB_OUTPUT"

  evidence:
    needs: admission
    if: ${{ !cancelled() && needs.admission.outputs.admitted == 'true' }}
    name: independent evidence / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, check, clippy, test, doc, policy, verifier]
    env:
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "expected candidate $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi

      - name: Install fixed Rust toolchain
        if: ${{ matrix.check != 'verifier' }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install fixed Python toolchain
        if: ${{ matrix.check == 'verifier' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run one fixed deterministic check
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ub-review-independent-${CHECK}-target"
          case "$CHECK" in
            fmt)
              cargo fmt --all -- --check
              ;;
            check)
              cargo check --workspace --all-targets --locked
              ;;
            clippy)
              cargo clippy --workspace --all-targets --locked -- -D warnings
              ;;
            test)
              cargo test --workspace --all-targets --locked
              ;;
            doc)
              cargo doc --workspace --no-deps --locked
              ;;
            policy)
              cargo run --locked --package xtask -- policy-check
              ;;
            verifier)
              python scripts/verify-bun-review-artifacts.py --self-test
              ;;
            *)
              echo "unknown independent baseline check: $CHECK" >&2
              exit 2
              ;;
          esac

  finalize:
    name: ${{ needs.admission.outputs.observation == 'true' && 'admission observation' || 'ub-review/independent-baseline' }}
    needs: [admission, evidence]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PR: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EXPECTED_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVENT_RETARGET: ${{ github.event.changes.base != null }}
      EVENT_REVIEW_STATE: ${{ github.event.review.state }}
      EVIDENCE_RESULT: ${{ needs.evidence.result }}
      OBSERVATION_ONLY: ${{ needs.admission.outputs.observation }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Write trusted exact-head baseline receipt
        if: ${{ needs.admission.outputs.observation != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/ub-review-independent-baseline"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg schema "ub-review.independent_baseline.v1" \
            --arg candidate_repository "$CANDIDATE_REPOSITORY" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg workflow_sha "$TRUSTED_WORKFLOW_SHA" \
            --arg evidence_result "$EVIDENCE_RESULT" \
            '{
              schema: $schema,
              candidate_repository: $candidate_repository,
              candidate_sha: $candidate_sha,
              trusted_workflow_sha: $workflow_sha,
              workflow_source: "protected-base",
              evidence_topology: "isolated-matrix-jobs",
              evidence_result: $evidence_result,
              commands: [
                "cargo fmt --all -- --check",
                "cargo check --workspace --all-targets --locked",
                "cargo clippy --workspace --all-targets --locked -- -D warnings",
                "cargo test --workspace --all-targets --locked",
                "cargo doc --workspace --no-deps --locked",
                "cargo run --locked --package xtask -- policy-check",
                "python scripts/verify-bun-review-artifacts.py --self-test"
              ]
            }' > "$receipt_dir/receipt.json"

      - name: Upload independent baseline receipt
        if: ${{ always() && needs.admission.outputs.observation != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-baseline-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ub-review-independent-baseline
          if-no-files-found: error
          retention-days: 7

      - name: Capture cancellation before finalization
        id: cancellation
        if: ${{ cancelled() }}
        shell: bash
        run: echo cancelled=true >> "$GITHUB_OUTPUT"
      - name: Enforce independent baseline
        if: ${{ always() }}
        shell: bash
        env:
          WORKFLOW_CANCELLED: ${{ steps.cancellation.outputs.cancelled == 'true' }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_CANCELLED" = false
          if [[ "$OBSERVATION_ONLY" == true ]]; then exit 0; fi
          test "$EVIDENCE_RESULT" = success
          test "$EVENT_ACTION" = labeled
          test "${EVENT_LABEL,,}" = merge-ready
          test -n "$EXPECTED_PR"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > "$RUNNER_TEMP/admission-live-pr.json"
          gh pr view "$EXPECTED_PR" --repo "$GITHUB_REPOSITORY" --json reviewDecision > "$RUNNER_TEMP/admission-review.json"
          # Native reviewDecision preserves GitHub's review aggregation semantics.
          jq -e 'has("reviewDecision") and (.reviewDecision == null or
            .reviewDecision == "APPROVED" or .reviewDecision == "REVIEW_REQUIRED" or
            .reviewDecision == "CHANGES_REQUESTED")' "$RUNNER_TEMP/admission-review.json" > /dev/null
          jq -e \
            --arg head "$EXPECTED_HEAD" --arg head_repo "$EXPECTED_HEAD_REPO" \
            --arg base "$EXPECTED_BASE" --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_repo "$EXPECTED_BASE_REPO" \
            '.head.sha == $head and .head.repo.full_name == $head_repo and
             .base.sha == $base and .base.ref == $base_ref and .base.repo.full_name == $base_repo' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null
          jq -e '.state == "open" and .draft == false and
            any(.labels[]; (.name | ascii_downcase) == "merge-ready")' \
            "$RUNNER_TEMP/admission-live-pr.json" > /dev/null
          jq -e '.reviewDecision != "CHANGES_REQUESTED"' "$RUNNER_TEMP/admission-review.json" > /dev/null
      - name: Reject workflow cancellation during finalization
        if: ${{ cancelled() }}
        shell: bash
        run: exit 1
